name: Desktop Release

# 多平台并行构建、独立早期发布与最终汇总（迁移指南 §10）。
#
# 拓扑（§10.1）：
#   validate (advisory)       build-windows-x64 → publish-windows
#                            build-macos-x64   → publish-macos-x64
#                            build-macos-arm64 → publish-macos-arm64
#                            build-linux-x64   → publish-linux
#                                  └──── all builds ────┘
#                                            ↓
#                                   assemble-release
#                                            ↓
#                                   publish-release (reconcile)
#
# 关键约束：
#   - 各构建 job 只上传 Actions artifact；对应 publish job 成功后立即追加到同版本 Release；
#   - assemble-release 校验并合并 updater 元数据（§10.5/§10.6）；
#   - publish job 只上传自己的独占文件，创建同一 Release 发生并发竞争时会重试确认；
#   - publish-release 在所有构建结束后合并 macOS 元数据并补齐 manifest.json。
#   - macOS 有凭据时签名+公证；缺失凭据时发布带 UNSIGNED 标记的测试包。
#   - 单个平台失败不阻塞其他成功平台；assemble/publish 只处理实际存在的 artifacts。
#   - validate 与平台构建并行且不作为其前置条件，避免全局校验拖掉所有平台。
#
# GitHub 托管 runner 标签会变化：实施时以官方文档为准（§10.1）——
#   macos-15-intel = Intel (x64)，macos-15 = Apple Silicon (arm64)。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ───────────────────────── validate ─────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (fixed patch from dev/.node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version

      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Verify setup-node version equals dev/.node-version
        run: |
          set -euo pipefail
          EXPECTED="$(cat dev/.node-version | tr -d '[:space:]')"
          ACTUAL="$(node -p "process.version.slice(1)")"
          echo "expected=$EXPECTED actual=$ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Install server dependencies
        working-directory: dev/web/server
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        working-directory: dev/web/client
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: dev/desktop
        run: npm ci --no-audit --no-fund

      - name: Run server tests
        working-directory: dev
        run: npm test --prefix web/server

      - name: Run desktop tests
        working-directory: dev
        run: npm test --prefix desktop

      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build

      # validate 不创建 Release（§10.2）。

  # ─────────────────────── build-windows-x64 ───────────────────
  build-windows-x64:
    runs-on: windows-latest # x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (win32/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform win32 --arch x64
      - name: Build NSIS installer (no publish)
        working-directory: dev/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never
      - name: Verify local artifacts + metadata hashes
        shell: bash
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform win32
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win32-x64
          path: |
            dev/desktop/release/TianShu-Setup-*.exe
            dev/desktop/release/TianShu-Setup-*.exe.blockmap
            dev/desktop/release/latest.yml
          if-no-files-found: error

  # ─────────────────────── build-macos-x64 ─────────────────────
  build-macos-x64:
    # macos-13 已于 2025-12 退役；Intel 构建使用官方替代标签。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (darwin/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform darwin --arch x64
      - name: Detect macOS signing and notarization credentials
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] \
            && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] \
            && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS x64 will be published as an unsigned test build"
          fi
      - name: Build DMG + ZIP (x64, signed + notarized)
        if: steps.signing.outputs.ready == 'true'
        working-directory: dev/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # 凭据齐全时生成正式签名、公证包。
        run: npx electron-builder --mac --x64 --publish never -c.mac.notarize=true
      - name: Build DMG + ZIP (x64, unsigned test build)
        if: steps.signing.outputs.ready != 'true'
        working-directory: dev/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --x64 --publish never -c.mac.notarize=false
          printf '%s\n' 'UNSIGNED macOS x64 test build. Gatekeeper may require Open Anyway.' > release/macOS-x64-UNSIGNED.txt
      - name: Verify signature and notarization (x64)
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APP="$(ls -d dist/mac*/天枢.app 2>/dev/null || ls -d dist/mac*/TianShu.app 2>/dev/null || find . -maxdepth 3 -name '天枢.app' | head -1)"
          [ -n "$APP" ]
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type exec "$APP"
          xcrun stapler validate "$APP"
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform mac-x64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: |
            dev/desktop/release/TianShu-*-mac-x64.dmg
            dev/desktop/release/TianShu-*-mac-x64.zip
            dev/desktop/release/latest-mac.yml
            dev/desktop/release/macOS-x64-UNSIGNED.txt
          if-no-files-found: error

  # ─────────────────────── build-macos-arm64 ───────────────────
  build-macos-arm64:
    runs-on: macos-15 # Apple Silicon arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (darwin/arm64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform darwin --arch arm64
      - name: Detect macOS signing and notarization credentials
        id: signing
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] \
            && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] \
            && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::macOS arm64 will be published as an unsigned test build"
          fi
      - name: Build DMG + ZIP (arm64, signed + notarized)
        if: steps.signing.outputs.ready == 'true'
        working-directory: dev/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=true
      - name: Build DMG + ZIP (arm64, unsigned test build)
        if: steps.signing.outputs.ready != 'true'
        working-directory: dev/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false
          printf '%s\n' 'UNSIGNED macOS arm64 test build. Gatekeeper may require Open Anyway.' > release/macOS-arm64-UNSIGNED.txt
      - name: Verify signature and notarization (arm64)
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 3 -name '天枢.app' | head -1)"
          [ -n "$APP" ]
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type exec "$APP"
          xcrun stapler validate "$APP"
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform mac-arm64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: |
            dev/desktop/release/TianShu-*-mac-arm64.dmg
            dev/desktop/release/TianShu-*-mac-arm64.zip
            dev/desktop/release/latest-mac.yml
            dev/desktop/release/macOS-arm64-UNSIGNED.txt
          if-no-files-found: error

  # ─────────────────────── build-linux-x64 ─────────────────────
  build-linux-x64:
    runs-on: ubuntu-24.04 # x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (linux/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform linux --arch x64
      - name: Build AppImage (no publish)
        working-directory: dev/desktop
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Build optional deb (does not block AppImage release)
        continue-on-error: true
        working-directory: dev/desktop
        run: npx electron-builder --linux deb --x64 --publish never
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dev/desktop/release/TianShu-*-linux-x64.AppImage
            dev/desktop/release/TianShu-*-linux-x64.deb
            dev/desktop/release/latest-linux.yml
          if-no-files-found: error

  # ───────────── independent early publishing ─────────────
  # 各平台构建完成即公布，不依赖其他平台；concurrency 只用于该平台自身防重。
  publish-windows:
    needs: build-windows-x64
    if: ${{ needs.build-windows-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publish-${{ github.ref_name }}-windows
      cancel-in-progress: false
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win32-x64
          path: early-assets
      - name: Publish Windows immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}。各平台构建完成后会陆续追加到本 Release；最终状态见 manifest.json。" \
              --draft || true
            # 另一平台可能刚刚创建了同一 Release；等待 GitHub API 可见。
            for ATTEMPT in 1 2 3 4 5; do
              gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
              sleep 2
            done
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          shopt -s nullglob
          PAYLOADS=(early-assets/TianShu-*)
          ((${#PAYLOADS[@]} > 0))
          [ -f early-assets/latest.yml ]
          gh release upload "$TAG" --repo "${{ github.repository }}" "${PAYLOADS[@]}" --clobber
          gh release upload "$TAG" --repo "${{ github.repository }}" early-assets/latest.yml --clobber
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          fi

  publish-linux:
    needs: build-linux-x64
    if: ${{ needs.build-linux-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publish-${{ github.ref_name }}-linux
      cancel-in-progress: false
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: early-assets
      - name: Publish Linux immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}。各平台构建完成后会陆续追加到本 Release；最终状态见 manifest.json。" \
              --draft || true
            for ATTEMPT in 1 2 3 4 5; do
              gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
              sleep 2
            done
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          shopt -s nullglob
          PAYLOADS=(early-assets/TianShu-*)
          ((${#PAYLOADS[@]} > 0))
          [ -f early-assets/latest-linux.yml ]
          gh release upload "$TAG" --repo "${{ github.repository }}" "${PAYLOADS[@]}" --clobber
          gh release upload "$TAG" --repo "${{ github.repository }}" early-assets/latest-linux.yml --clobber
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          fi

  publish-macos-x64:
    needs: build-macos-x64
    if: ${{ needs.build-macos-x64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publish-${{ github.ref_name }}-macos-x64
      cancel-in-progress: false
    steps:
      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-x64
          path: early-assets
      - name: Publish macOS x64 installer immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}。各平台构建完成后会陆续追加到本 Release；最终状态见 manifest.json。" \
              --draft || true
            for ATTEMPT in 1 2 3 4 5; do
              gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
              sleep 2
            done
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          shopt -s nullglob
          # latest-mac.yml 需合并两个架构，由最终汇总任务发布。
          ASSETS=(early-assets/*.dmg early-assets/*.zip early-assets/*-UNSIGNED.txt)
          ((${#ASSETS[@]} > 0))
          gh release upload "$TAG" --repo "${{ github.repository }}" "${ASSETS[@]}" --clobber
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          fi

  publish-macos-arm64:
    needs: build-macos-arm64
    if: ${{ needs.build-macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publish-${{ github.ref_name }}-macos-arm64
      cancel-in-progress: false
    steps:
      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: early-assets
      - name: Publish macOS arm64 installer immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}。各平台构建完成后会陆续追加到本 Release；最终状态见 manifest.json。" \
              --draft || true
            for ATTEMPT in 1 2 3 4 5; do
              gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
              sleep 2
            done
            gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          shopt -s nullglob
          # latest-mac.yml 需合并两个架构，由最终汇总任务发布。
          ASSETS=(early-assets/*.dmg early-assets/*.zip early-assets/*-UNSIGNED.txt)
          ((${#ASSETS[@]} > 0))
          gh release upload "$TAG" --repo "${{ github.repository }}" "${ASSETS[@]}" --clobber
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
          fi

  # ─────────────────────── assemble-release ────────────────────
  assemble-release:
    needs: [build-windows-x64, build-macos-x64, build-macos-arm64, build-linux-x64]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dev deps (js-yaml for metadata merge)
        working-directory: dev
        run: npm ci --no-audit --no-fund
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble + merge updater metadata
        working-directory: dev
        run: node scripts/assemble-desktop-release.mjs ../artifacts --out ../release-assets --allow-partial
      - name: Verify final release asset manifest
        working-directory: dev
        run: node scripts/verify-desktop-release.mjs --dir ../release-assets --allow-partial
      - name: Upload assembled release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  # ─────────────────────── publish-release ─────────────────────
  publish-release:
    needs: assemble-release
    if: ${{ needs.assemble-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-release-publish-${{ github.ref_name }}-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install release verifier dependencies
        working-directory: dev
        run: npm ci --no-audit --no-fund
      - name: Download assembled assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dev/desktop/package.json').version")"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}。各平台独立构建，成功产物均会发布；macOS 的 *-UNSIGNED.txt 表示该架构为未签名测试包。完整状态见 manifest.json。" \
              --draft || true
            for ATTEMPT in 1 2 3 4 5; do
              gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
              sleep 2
            done
            gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null
            echo "draft release v${VERSION} is ready"
          else
            echo "release v${VERSION} already exists; will upload assets"
          fi
      - name: Upload installers + update payloads (metadata last)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          # 先上传安装包、更新载荷和状态 manifest，元数据最后上传。
          for f in *; do
            case "$f" in
              latest.yml|latest-mac.yml|latest-linux.yml) continue ;;
            esac
            gh release upload "v${VERSION}" --repo "${{ github.repository }}" "$f" --clobber
          done
          # 元数据最后上传，避免客户端看到未就绪的版本（§10.7）
          for f in latest.yml latest-mac.yml latest-linux.yml; do
            if [ -f "$f" ]; then
              gh release upload "v${VERSION}" --repo "${{ github.repository }}" "$f" --clobber
            fi
          done
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
      - name: Verify published release assets
        run: node dev/scripts/verify-desktop-release.mjs --remote "v${VERSION}" --repo "${{ github.repository }}" --allow-partial
