name: Desktop Release

# 多平台构建与单点发布（迁移指南 §10）。
#
# 拓扑（§10.1）：
#   validate
#     ├─ build-windows-x64
#     ├─ build-macos-x64      (Intel runner)
#     ├─ build-macos-arm64    (Apple Silicon runner)
#     └─ build-linux-x64
#             ↓
#        assemble-release
#             ↓
#        publish-release
#
# 关键约束：
#   - 各构建 job 只上传 Actions artifact，绝不调用 gh release（§2.5/§10.3）；
#   - assemble-release 校验并合并 updater 元数据（§10.5/§10.6）；
#   - publish-release 是唯一拥有 contents: write 的 job（§10.7），
#     元数据（latest*.yml）最后上传，避免客户端看到未就绪的版本。
#   - macOS 正式构建必须签名+公证；缺失凭据时构建失败，publish 不运行（§9.2/§14.1）。
#
# GitHub 托管 runner 标签会变化：实施时以官方文档为准（§10.1）——
#   macos-13 = Intel (x64)，macos-14/macos-15 = Apple Silicon (arm64)。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ───────────────────────── validate ─────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (fixed patch from dev/.node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version

      - name: Verify tag matches desktop version
        run: node dev/scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Verify setup-node version equals dev/.node-version
        run: |
          set -euo pipefail
          EXPECTED="$(cat dev/.node-version | tr -d '[:space:]')"
          ACTUAL="$(node -p "process.version.slice(1)")"
          echo "expected=$EXPECTED actual=$ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ]

      - name: Install server dependencies
        working-directory: dev/web/server
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        working-directory: dev/web/client
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: dev/desktop
        run: npm ci --no-audit --no-fund

      - name: Run server tests
        working-directory: dev
        run: npm test --prefix web/server

      - name: Run desktop tests
        working-directory: dev
        run: npm test --prefix desktop

      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build

      # validate 不创建 Release（§10.2）。

  # ─────────────────────── build-windows-x64 ───────────────────
  build-windows-x64:
    needs: validate
    runs-on: windows-latest # x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (win32/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform win32 --arch x64
      - name: Build NSIS installer (no publish)
        working-directory: dev/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never
      - name: Verify local artifacts + metadata hashes
        shell: bash
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform win32
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win32-x64
          path: dev/desktop/release/*
          if-no-files-found: error

  # ─────────────────────── build-macos-x64 ─────────────────────
  build-macos-x64:
    needs: validate
    runs-on: macos-13 # Intel x64（§10.1 注释：以官方 runner 文档为准）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (darwin/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform darwin --arch x64
      - name: Build DMG + ZIP (x64, signed + notarized)
        working-directory: dev/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # notarize=true：凭据缺失时构建失败 → publish 不运行（§9.2/§14.1）。
        run: npx electron-builder --mac --x64 --publish never -c.mac.notarize=true
      - name: Verify signature and notarization (x64)
        run: |
          set -euo pipefail
          APP="$(ls -d dist/mac*/天枢.app 2>/dev/null || ls -d dist/mac*/TianShu.app 2>/dev/null || find . -maxdepth 3 -name '天枢.app' | head -1)"
          [ -n "$APP" ]
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type exec "$APP"
          xcrun stapler validate "$APP"
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform mac-x64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: dev/desktop/release/*
          if-no-files-found: error

  # ─────────────────────── build-macos-arm64 ───────────────────
  build-macos-arm64:
    needs: validate
    runs-on: macos-14 # Apple Silicon arm64（§10.1 注释：以官方 runner 文档为准）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (darwin/arm64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform darwin --arch arm64
      - name: Build DMG + ZIP (arm64, signed + notarized)
        working-directory: dev/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=true
      - name: Verify signature and notarization (arm64)
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 3 -name '天枢.app' | head -1)"
          [ -n "$APP" ]
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --verbose --type exec "$APP"
          xcrun stapler validate "$APP"
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform mac-arm64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dev/desktop/release/*
          if-no-files-found: error

  # ─────────────────────── build-linux-x64 ─────────────────────
  build-linux-x64:
    needs: validate
    runs-on: ubuntu-24.04 # x64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dependencies
        working-directory: dev
        run: npm run install:all
      - name: Build server + client + desktop
        working-directory: dev
        run: npm run build
      - name: Prepare runtime + packaged smoke (linux/x64)
        working-directory: dev
        run: node scripts/prepare-desktop-runtime.mjs --platform linux --arch x64
      - name: Build AppImage + deb (no publish)
        working-directory: dev/desktop
        run: npx electron-builder --linux --x64 --publish never
      - name: Verify local artifacts + metadata hashes
        working-directory: dev/desktop/release
        run: node ../../scripts/verify-desktop-release.mjs --platform linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dev/desktop/release/*
          if-no-files-found: error

  # ─────────────────────── assemble-release ────────────────────
  assemble-release:
    needs: [build-windows-x64, build-macos-x64, build-macos-arm64, build-linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Install dev deps (js-yaml for metadata merge)
        working-directory: dev
        run: npm ci --no-audit --no-fund
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble + merge updater metadata
        working-directory: dev
        run: node scripts/assemble-desktop-release.mjs ../artifacts --out ../release-assets
      - name: Verify final release asset manifest
        working-directory: dev
        run: node scripts/verify-desktop-release.mjs --dir ../release-assets
      - name: Upload assembled release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  # ─────────────────────── publish-release ─────────────────────
  publish-release:
    needs: assemble-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # 唯一拥有 write 的 job（§10.7）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: dev/.node-version
      - name: Download assembled assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dev/desktop/package.json').version")"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "天枢桌面客户端 v${VERSION}（多平台）。下载指引见发布说明。" \
              --draft
            echo "draft release v${VERSION} created"
          else
            echo "release v${VERSION} already exists; will upload assets"
          fi
      - name: Upload installers + update payloads (metadata last)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          # 先上传安装包与更新载荷，排除元数据和内部 manifest
          for f in *; do
            case "$f" in
              latest.yml|latest-mac.yml|latest-linux.yml|manifest.json) continue ;;
            esac
            gh release upload "v${VERSION}" --repo "${{ github.repository }}" "$f" --clobber
          done
          # 元数据最后上传，避免客户端看到未就绪的版本（§10.7）
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" \
            latest.yml latest-mac.yml latest-linux.yml --clobber
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false
      - name: Verify published release assets
        run: node dev/scripts/verify-desktop-release.mjs --remote "v${VERSION}" --repo "${{ github.repository }}"
