name: Desktop Release

# Windows x64 安装包构建与发布。
# 发布目标：当前公开源码仓库 dmql98/tianshu。
# 客户端更新走 electron-updater（app-update.yml 指向本仓库），客户端内不包含任何 token。
# electron-builder 只负责构建（--publish never，避免其“并发创建同 tag Release”的竞态）；
# 发布用 gh CLI 确定性创建 Release 并上传 exe/blockmap/latest.yml。
# 发布使用 GitHub 默认的 GITHUB_TOKEN（permissions.contents.write），无需额外 secret。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify tag matches desktop version
        shell: bash
        run: node dev/scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Install server dependencies
        working-directory: dev/web/server
        run: npm ci --no-audit --no-fund

      - name: Install client dependencies
        working-directory: dev/web/client
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependencies
        working-directory: dev/desktop
        run: npm ci --no-audit --no-fund

      - name: Run server tests
        working-directory: dev
        run: npm test --prefix web/server

      - name: Run desktop tests
        working-directory: dev
        run: npm test --prefix desktop

      - name: Build server
        working-directory: dev
        run: npm run build:server

      - name: Build client
        working-directory: dev
        run: npm run build:client

      - name: Build desktop
        working-directory: dev
        run: npm run build:desktop

      - name: Prepare desktop runtime + packaged smoke test
        # downloads fixed portable Node 24, verifies SHA-256, stages server/client,
        # `npm ci --omit=dev` in staging, and runs the bundled-Node smoke test.
        working-directory: dev
        run: npm run prepare:desktop

      - name: Build NSIS installer (no publish)
        working-directory: dev/desktop
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --x64 --publish never

      - name: Verify local release artifacts
        shell: bash
        working-directory: dev/desktop/release
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('../package.json').version")"
          for f in "TianShu-Setup-${VERSION}-x64.exe" "TianShu-Setup-${VERSION}-x64.exe.blockmap" latest.yml; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required artifact: $f"
              exit 1
            fi
          done
          echo "Installer SHA-256:"
          sha256sum "TianShu-Setup-${VERSION}-x64.exe"

      - name: Create GitHub release
        working-directory: dev/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! gh release view "v${VERSION}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            NOTES=$(printf '天枢桌面客户端 v%s。\n- 安装包: TianShu-Setup-%s-x64.exe\n- 无需安装 Node.js，内置便携 Node 运行时\n- 用户数据位于 %%APPDATA%%\\tianshu-desktop，升级/卸载不会删除数据\n- 安装包 SHA-256 见上方校验步骤' "$VERSION" "$VERSION")
            gh release create "v${VERSION}" --repo "${{ github.repository }}" \
              --title "天枢 v${VERSION}" \
              --notes "$NOTES" \
              --latest
            echo "release v${VERSION} created"
          else
            echo "release v${VERSION} already exists; uploading assets"
          fi

      - name: Upload release assets
        working-directory: dev/desktop/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('../package.json').version")"
          gh release upload "v${VERSION}" --repo "${{ github.repository }}" \
            "TianShu-Setup-${VERSION}-x64.exe" \
            "TianShu-Setup-${VERSION}-x64.exe.blockmap" \
            latest.yml \
            --clobber

      - name: Verify published release assets
        shell: bash
        working-directory: dev/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ASSETS="$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json assets -q '.assets[].name')"
          echo "published assets:"
          echo "$ASSETS"
          for f in "TianShu-Setup-${VERSION}-x64.exe" "TianShu-Setup-${VERSION}-x64.exe.blockmap" latest.yml; do
            echo "$ASSETS" | grep -Fqx "$f" || { echo "::error::missing published asset: $f"; exit 1; }
          done

      - name: Warn about unsigned build
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        # `secrets` is not available in `if:`; inject it via env and check in shell.
        shell: bash
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::No WIN_CSC_LINK configured — installer is unsigned (SmartScreen will warn). Sign before wide distribution."
          fi
