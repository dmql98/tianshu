<div id="toastWrap" class="fixed bottom-6 right-6 z-[60] space-y-3"></div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n >= 10000 ? (n/10000).toFixed(1)+'万' : n >= 1000 ? (n/1000).toFixed(1)+'k' : n;
const toast = (msg, ok=true) => {
  const t = document.createElement('div');
  t.className = 'toast-in flex items-center gap-3 px-4 py-3 rounded-xl border text-sm shadow-2xl shadow-black/50 glass '+(ok?'bg-emerald-500/15 border-emerald-500/30 text-emerald-300':'bg-rose-500/15 border-rose-500/30 text-rose-300');
  t.innerHTML = `<i class="fa-solid ${ok?'fa-circle-check':'fa-circle-exclamation'}"></i><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateX(24px)';setTimeout(()=>t.remove(),300);},2600);
};

let curPage = 'dashboard';
const titles = { dashboard:'数据看板', assets:'资产管理', review:'审核队列', categories:'分类管理', users:'用户管理', settings:'系统设置', logs:'操作日志' };

function switchPage(page) {
  curPage = page;
  $('#pageTitle').textContent = titles[page] || page;
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('nav-active', btn.dataset.page === page);
  });
  renderPage();
}

/* ═══════════════ 数据看板 ═══════════════ */
// 真实统计数据（由 API 加载后填充）
let ADM = null;
async function loadAdminStats(){
  try {
    ADM = await MarketAPI.adminStats();
    if (curPage === 'dashboard') renderPage();
  } catch(e) { /* 非管理员或未登录，保持静态示例 */ }
}

    <div class="rounded-xl bg-ink-900 border border-zinc-800 overflow-hidden">
      <div class="divide-y divide-zinc-800/80">
        ${logs.map(l => `
        <div class="flex items-center gap-4 px-5 py-3 hover:bg-zinc-800/30 transition">
          <span class="text-[11px] text-zinc-600 font-mono shrink-0 w-16">${l.time}</span>
          <i class="fa-solid ${l.icon} ${l.color} text-sm shrink-0"></i>
          <div class="flex-1 min-w-0">
            <span class="text-zinc-300 text-sm">${l.user}</span>
            <span class="text-zinc-600 text-sm mx-1.5">·</span>
            <span class="text-zinc-400 text-sm">${l.action}</span>
            <span class="text-zinc-600 text-sm mx-1.5">·</span>
            <span class="text-zinc-300 text-sm">${l.target}</span>
          </div>
        </div>`).join('')}
      </div>
      <!-- 分页 -->
      <div class="flex items-center justify-between px-5 py-3 border-t border-zinc-800">
        <span class="text-xs text-zinc-600">共 12,847 条日志</span>
        <div class="flex items-center gap-1">
          <button class="w-7 h-7 rounded-md bg-ink-800 border border-zinc-800 grid place-items-center text-xs text-zinc-500 cursor-not-allowed"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="w-7 h-7 rounded-md bg-brand-500/15 text-brand-300 grid place-items-center text-xs font-medium">1</button>
          <button class="w-7 h-7 rounded-md hover:bg-zinc-800 grid place-items-center text-xs text-zinc-500 transition">2</button>
          <button class="w-7 h-7 rounded-md hover:bg-zinc-800 grid place-items-center text-xs text-zinc-500 transition">3</button>
          <button class="w-7 h-7 rounded-md bg-ink-800 border border-zinc-800 grid place-items-center text-xs text-zinc-400 hover:text-zinc-200 transition"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════ 渲染调度 ═══════════════ */
function renderPage() {
  const map = {
    dashboard: renderDashboard,
    assets: renderAssets,
    review: renderReview,
    categories: renderCategories,
    users: renderUsers,
    settings: renderSettings,
    logs: renderLogs,
  };
  const fn = map[curPage];
  if (fn) $('#pageContent').innerHTML = fn();
}

// 管理后台守卫：未登录跳登录页，已登录但非管理员提示无权限
document.addEventListener('DOMContentLoaded', async () => {
  if (!MarketAPI.isLoggedIn()) { location.href = 'login.html'; return; }
  try {
    const d = await MarketAPI.me();
    if (!d.user || d.user.role !== 'admin') {
      document.body.innerHTML = `
        <div class="h-screen flex items-center justify-center bg-ink-950">
          <div class="text-center">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-ink-800 border border-zinc-800 grid place-items-center mb-5"><i class="fa-solid fa-shield-halved text-2xl text-rose-400"></i></div>
            <h3 class="font-semibold text-zinc-300 mb-2">无权访问管理后台</h3>
            <p class="text-sm text-zinc-500 mb-6">当前账号不是管理员，请联系管理员授权</p>
            <a href="login.html" class="inline-block h-9 px-5 rounded-lg bg-brand-500 hover:bg-brand-400 text-ink-950 font-semibold text-sm transition active:scale-95">切换管理员账号</a>
          </div>
        </div>`;
      return;
    }
    renderPage(); loadAdminStats();
  } catch (e) {
    MarketAPI.logout();
    location.href = 'login.html';
  }
});
</script>
</body>
