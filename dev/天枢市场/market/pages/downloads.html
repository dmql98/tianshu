<div id="toastWrap" class="fixed bottom-6 right-6 z-[60] space-y-3"></div>

<script>
const CATS = {
  character:{ name:'角色',   icon:'fa-solid fa-user-astronaut', grad:'from-amber-500/80 to-orange-600/80' },
  skin:{     name:'皮肤',   icon:'fa-solid fa-shirt',          grad:'from-rose-500/80 to-pink-600/80' },
  skill:{    name:'技能',   icon:'fa-solid fa-wand-magic-sparkles', grad:'from-emerald-500/80 to-teal-600/80' },
  tool:{     name:'工具',   icon:'fa-solid fa-screwdriver-wrench',  grad:'from-sky-500/80 to-blue-600/80' },
  mcp:{      name:'MCP',    icon:'fa-solid fa-plug-circle-bolt',    grad:'from-cyan-500/80 to-sky-600/80' },
  kb:{       name:'知识库', icon:'fa-solid fa-book-open',      grad:'from-indigo-500/80 to-violet-600/80' },
  theme:{    name:'主题',   icon:'fa-solid fa-palette',        grad:'from-teal-500/80 to-emerald-600/80' },
  iconpack:{ name:'图标包', icon:'fa-solid fa-icons',          grad:'from-orange-500/80 to-amber-600/80' },
};
let MINE = [];

async function loadMINE(){
  if (!MarketAPI.isLoggedIn()) { MINE = []; renderAll(); return; }
  try {
    const list = await MarketAPI.myInstalls();
    // 补充展示字段
    MINE = list.map(a => ({
      id: a.id, cat: a.cat, name: a.name,
      ver: a.ver, latest: a.ver,
      size: a.file_size ? (a.file_size/1024).toFixed(1)+' KB' : '—',
      date: '', from: null,
    }));
  } catch(e) { toast(e.message, false); }
  renderAll();
}
let curChip = 'all';
const $ = s => document.querySelector(s);

function toast(msg, ok=true){
  const t = document.createElement('div');
  t.className = 'toast-in flex items-center gap-3 px-4 py-3 rounded-xl border text-sm shadow-2xl shadow-black/50 glass ' + (ok ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/15 border-rose-500/30 text-rose-300');
  t.innerHTML = `<i class="fa-solid ${ok?'fa-circle-check':'fa-circle-exclamation'}"></i><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='all .3s'; t.style.opacity='0'; t.style.transform='translateX(24px)'; setTimeout(()=>t.remove(),300); }, 2600);
}
function renderChips(){
  const present = [...new Set(MINE.map(a=>a.cat))];
  const all = [['all','全部'], ...present.map(k=>[k, CATS[k].name])];
  $('#chips').innerHTML = all.map(([k,n])=>{
    const cnt = k==='all' ? MINE.length : MINE.filter(a=>a.cat===k).length;
    const on = curChip===k;
    return `<button onclick="curChip='${k}';renderAll()" class="h-8 px-3.5 rounded-lg text-xs font-medium transition active:scale-95 ${on?'bg-brand-500/15 border border-brand-500/40 text-brand-300':'bg-ink-900 border border-zinc-800 text-zinc-400 hover:border-zinc-600'}">${n} <span class="${on?'text-brand-400/70':'text-zinc-600'} ml-0.5">${cnt}</span></button>`;
  }).join('');
}
function rowHTML(a, i){
  const c = CATS[a.cat];
  const hasUp = a.ver !== a.latest;
  return `
  <div class="fade-in flex items-center gap-4 rounded-2xl bg-ink-900 border border-zinc-800 hover:border-zinc-700 p-4 transition group" style="animation-delay:${i*40}ms" data-row="${a.id}">
    <span class="relative w-11 h-11 rounded-xl bg-gradient-to-br ${c.grad} grid place-items-center shrink-0 star-field">
      <i class="${c.icon} text-white/90"></i>
    </span>
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="font-medium text-zinc-100 truncate">${a.name}</span>
        ${hasUp ? `<span class="px-2 py-0.5 rounded-md bg-amber-500/15 border border-amber-500/30 text-amber-300 text-[11px] shrink-0"><i class="fa-solid fa-arrow-up mr-0.5"></i>可更新 v${a.latest}</span>`
                : `<span class="px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 text-[11px] shrink-0">已是最新</span>`}
      </div>
      <div class="text-xs text-zinc-500 mt-1 flex items-center gap-1.5 flex-wrap">
        <span>${c.name}</span><span class="text-zinc-700">·</span><span>v${a.ver}</span><span class="text-zinc-700">·</span><span>${a.size}</span><span class="text-zinc-700">·</span><span>${a.date}安装</span>
        ${a.from ? `<span class="text-zinc-700">·</span><span class="text-brand-400/70"><i class="fa-solid fa-diagram-project mr-0.5"></i>关联自「${a.from}」</span>` : ''}
      </div>
    </div>
    ${hasUp ? `<button onclick="doUpdate(this, ${a.id})" class="h-8 px-3.5 rounded-lg bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-medium hover:bg-amber-500/25 transition active:scale-95 shrink-0">更新</button>` : ''}
    <button onclick="uninstall(${a.id})" class="h-8 px-3.5 rounded-lg bg-ink-800 border border-zinc-800 text-zinc-500 hover:text-rose-300 hover:border-rose-500/30 text-xs transition active:scale-95 shrink-0">卸载</button>
  </div>`;
}
function emptyHTML(){
  return `<div class="flex flex-col items-center justify-center py-24 fade-in">
    <div class="w-16 h-16 rounded-2xl bg-ink-800 border border-zinc-800 grid place-items-center mb-5"><i class="fa-solid fa-cloud-arrow-down text-2xl text-zinc-600"></i></div>
    <h3 class="font-semibold text-zinc-300 mb-2">暂无已安装资产</h3>
    <p class="text-sm text-zinc-500 mb-6">去市场挑选喜欢的角色、技能与主题吧</p>
    <a href="../index.html" class="h-9 px-5 rounded-lg bg-brand-500 hover:bg-brand-400 text-ink-950 font-semibold text-sm transition active:scale-95 flex items-center">浏览市场</a>
  </div>`;
}
function renderAll(){
  const list = curChip==='all' ? MINE : MINE.filter(a=>a.cat===curChip);
  renderChips();
  $('#statTotal').textContent = MINE.length;
  $('#statUpdate').textContent = MINE.filter(a=>a.ver!==a.latest).length;
  $('#navCount').textContent = MINE.length;
  $('#list').innerHTML = list.length ? list.map(rowHTML).join('') : emptyHTML();
}
function doUpdate(btn, id){
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>'; btn.disabled = true;
  setTimeout(()=>{
    const a = MINE.find(x=>x.id===id); a.ver = a.latest;
    toast(`「${a.name}」已更新至 v${a.latest}`);
    renderAll();
  }, 900);
}
function uninstall(id){
  const a = MINE.find(x=>x.id===id);
  const row = document.querySelector(`[data-row="${id}"]`);
  if (row) row.classList.add('row-out');
  setTimeout(()=>{
    MarketAPI.uninstall(id).then(()=>{
      MINE = MINE.filter(x=>x.id!==id);
      if(!MINE.find(x=>x.cat===curChip)) curChip='all';
      renderAll(); toast(`已卸载「${a.name}」`);
    }).catch(e=>{ toast(e.message,false); if(row) row.classList.remove('row-out'); });
  }, 280);
}
function checkUpdate(btn){
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>检查中'; btn.disabled = true;
  setTimeout(()=>{
    const n = MINE.filter(a=>a.ver!==a.latest).length;
    btn.innerHTML = '<i class="fa-solid fa-rotate mr-1.5"></i>检查更新'; btn.disabled = false;
    toast(n ? `发现 ${n} 个可用更新` : '所有资产均已是最新版本');
  }, 1000);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') history.back(); });
loadMINE();
</script>
