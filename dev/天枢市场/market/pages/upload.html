  const t = document.createElement('div');

  t.innerHTML = `<i class=\"fa-solid ${ok?'fa-circle-check':'fa-circle-exclamation'}\"></i><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='all .3s'; t.style.opacity='0'; t.style.transform='translateX(24px)'; setTimeout(()=>t.remove(),300); }, 2600);
}

    <div class="rounded-xl bg-ink-900 border border-zinc-800 p-5 space-y-4">
      <div class="flex items-center gap-2"><i class="fa-solid fa-server text-brand-400 text-sm"></i><span class="text-sm font-semibold text-zinc-100">API 配置</span></div>

const FIELD_NONE = '<div class="text-xs text-zinc-500 border-l-2 border-brand-500/40 pl-3">该类型无需额外配置，直接上传资产文件即可。</div>';

// 提供商配置项动态行（与详情页 renderProviderPanel 的 fields 对齐）
function addFieldRow(){
  const wrap = document.getElementById('f_fieldsRows');
  if (!wrap) return;
  const div = document.createElement('div');
  div.className = 'prov-field grid grid-cols-[1fr_90px_1fr_auto] gap-2 items-center';
  div.innerHTML = `
    <input class="pf-label w-full h-9 px-3 rounded-lg bg-ink-800 border border-zinc-800 text-sm outline-none focus:border-brand-500/60 transition placeholder-zinc-600" placeholder="配置项名称，如 API Key">
    <select class="pf-type w-full h-9 px-2 rounded-lg bg-ink-800 border border-zinc-800 text-sm outline-none focus:border-brand-500/60 transition">
      <option value="string">string</option><option value="secret">secret</option>
    </select>
    <input class="pf-ph w-full h-9 px-3 rounded-lg bg-ink-800 border border-zinc-800 text-sm outline-none focus:border-brand-500/60 transition placeholder-zinc-600" placeholder="占位提示">
    <span class="flex items-center gap-2">
      <label class="text-[11px] text-zinc-500 flex items-center gap-1 cursor-pointer"><input type="checkbox" class="pf-required accent-amber-500 w-3 h-3">必填</label>
      <button type="button" onclick="this.closest('.prov-field').remove()" class="w-7 h-7 rounded-lg bg-ink-800 border border-zinc-800 grid place-items-center text-zinc-500 hover:text-rose-400 hover:border-rose-500/40 transition" title="删除"><i class="fa-solid fa-trash text-[10px]"></i></button>
    </span>`;
  wrap.appendChild(div);
}

function renderTypeGrid(){
  $('#typeGrid').innerHTML = Object.entries(CATS).map(([k,c])=>`
    <button onclick="upType='${k}';renderTypeGrid()" class="flex flex-col items-center gap-1.5 py-3 rounded-xl border transition active:scale-95 ${upType===k?'border-brand-500/60 bg-brand-500/10 text-brand-300':'border-zinc-800 bg-ink-850 text-zinc-400 hover:border-zinc-600'}">
      <i class="${c.icon} text-lg"></i><span class="text-xs">${c.name}</span>
    </button>`).join('');
  // 切换类型时渲染专属配置区
  $('#detailFields').innerHTML = FIELD_TPL[upType] || FIELD_NONE;
}

// 收集类型专属字段 → detail_data 对象
function collectDetailData(){
  const $val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const split = s => s.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean);
  const dd = {};
  // 通用：更新日志（详情页 renderChangelogCard 渲染）
  const changelog = $val('upChangelog').split('\n').map(line => {
    const idx = line.indexOf('|');
    if (idx < 0) return null;
    const ver = line.slice(0, idx).trim();
    const desc = line.slice(idx + 1).trim();
    return ver && desc ? { ver, desc } : null;
  }).filter(Boolean);
  if (changelog.length) dd.changelog = changelog;
  switch (upType) {
    case 'character':
      dd.characterData = {
        tools: split($val('f_tools')), skills: split($val('f_skills')),
        maxSteps: parseInt($val('f_maxSteps')) || 999, strategy: $val('f_strategy') || 'Ask Risky',
        soul: $val('f_soul'),
        visual: { avatar: $val('f_avatar')||undefined, portrait: $val('f_portrait')||undefined },
      };
      break;
    case 'skill':
      dd.skillData = {
        children: $val('f_children').split('\n').map(l=>{ const [name,...desc]=l.split('|'); const n=name.trim(); if(!n) return null; return { name:n, description: desc.join('|').trim() }; }).filter(Boolean),
        files: $val('f_files').split('\n').map(x=>x.trim()).filter(Boolean),
      };
      break;
    case 'theme':
      dd.themeData = {
        appearance: $val('f_appearance') || 'dark',
        colors: { primary:$val('f_primary'), background:$val('f_background'), surface:$val('f_surface'), surfaceLight:$val('f_surfaceLight'), text:$val('f_text'), textSecondary:$val('f_textSecondary'), border:$val('f_border'), borderLight:$val('f_borderLight'), success:$val('f_success'), warning:$val('f_warning'), error:$val('f_error'), info:$val('f_info') },
        artwork: $val('f_artwork') || undefined,
      };
      break;
    case 'mcp':
      dd.mcpData = {
        command: $val('f_command'), args: $val('f_args').split(/\s+/).filter(Boolean),
        capabilities: Array.from(document.querySelectorAll('#f_capabilities option:checked')).map(o=>o.value),
        tools: split($val('f_mcp_tools')), status: $val('f_status') || 'stable',
      };
      break;
    case 'iconpack':
      dd.iconpackData = { slotCount: parseInt($val('f_slotCount')) || 0, previewIcons: split($val('f_previewIcons')), slots: {} };
      break;
    case 'tool':
      dd.toolData = { format: $val('f_format'), size: $val('f_size') };
      break;
    case 'provider':
      dd.providerData = {
        baseUrl: $val('f_baseUrl'),
        models: split($val('f_models')),
        fields: Array.from(document.querySelectorAll('#f_fieldsRows .prov-field')).map(row => ({
          label: row.querySelector('.pf-label').value.trim(),
          required: row.querySelector('.pf-required').checked,
          type: row.querySelector('.pf-type').value,
          placeholder: row.querySelector('.pf-ph').value.trim(),
        })).filter(f => f.label),
      };
      break;
  }
  return dd;
}

function submitUpload(){
  const name = $('#upName').value.trim();
  if (!name){
    toast('请填写资产名称', false);
    $('#upName').focus();
    return;
  }
  const file = window.__upFile || null;
  if (!file) { toast('请选择要上传的资产文件', false); return; }
  if (!MarketAPI.isLoggedIn()) { toast('请先登录', false); setTimeout(()=>location.href='login.html',800); return; }

  // 构造 FormData（任意文件类型）
  const fd = new FormData();
  fd.append('file', file);
  fd.append('name', name);
  fd.append('desc', $('#upDesc').value.trim());
  fd.append('ver', $('#upVer').value.trim() || '1.0.0');
  fd.append('cat', upType);
  fd.append('tags', $('#upTags').value.trim());
  // 类型专属字段 → detail_data JSON
  const dd = collectDetailData();
  if (Object.keys(dd).length) fd.append('detail_data', JSON.stringify(dd));

  const btn = $('#submitBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>上传中…'; }

  MarketAPI.uploadAsset(fd)
    .then(()=>{
      toast(`「${name}」已提交审核，通过后将自动上架`);
      setTimeout(()=>{ window.location.href = 'uploads.html'; }, 1200);
    })
    .catch(e=>{
      toast(e.message || '上传失败', false);
      if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1.5"></i>提交审核'; }
    });
}

// 文件拖拽/选择功能（支持任意文件类型）
let __upFile = null;
const dz = $('#dropZone');
const fi = $('#fileInput');
function setFile(f){
  if (!f) return;
  __upFile = f;
  $('#fileName').textContent = '已选择：'+f.name+'（'+(f.size/1024).toFixed(1)+' KB）';
  $('#fileName').classList.remove('hidden');
}
['dragover','dragenter'].forEach(e=>dz.addEventListener(e, ev=>{ev.preventDefault(); dz.classList.add('drop-active');}));
['dragleave','drop'].forEach(e=>dz.addEventListener(e, ev=>{ev.preventDefault(); dz.classList.remove('drop-active');
  if(e==='drop' && ev.dataTransfer.files[0]) setFile(ev.dataTransfer.files[0]);
}));
dz.addEventListener('click', ()=>{ fi.click(); });
fi.addEventListener('change', ()=>{ if(fi.files[0]) setFile(fi.files[0]); });

// 初始化
renderTypeGrid();
</script>
