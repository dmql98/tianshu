<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 天枢市场</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {

      colors: {
        brand: { 50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309' },

    }
  }
}
</script>
<style>
  body { font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif; }
  .glass { backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .fade-in { animation:fadeIn .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeIn { from {opacity:0;transform:translateY(12px);} to {opacity:1;transform:none;} }
  .fade-in-delay { animation:fadeIn .4s cubic-bezier(.2,.8,.2,1) .1s both; }
  .toast-in { animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes toastIn { from {opacity:0;transform:translateX(24px);} to {opacity:1;transform:none;} }
  .star-field { background-image:radial-gradient(1px 1px at 20% 30%,rgba(251,191,36,.5) 50%,transparent 51%),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.35) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 45% 75%,rgba(251,191,36,.4) 50%,transparent 51%),radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.3) 50%,transparent 51%),radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,.25) 50%,transparent 51%); }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .float { animation:float 4s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce) { * {animation:none!important;transition:none!important;} }
  .input-focus { transition: border-color .2s, box-shadow .2s; }
  .input-focus:focus { border-color:rgba(245,158,11,.5); box-shadow:0 0 0 3px rgba(245,158,11,.12); }
  /* 密码可见切换 */
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:2.5rem; }
  .pw-toggle { position:absolute; right:0.75rem; top:50%; transform:translateY(-50%); color:#52525b; cursor:pointer; }
  .pw-toggle:hover { color:#a1a1aa; }
</style>
</head>
<body class="bg-ink-950 text-zinc-200 antialiased min-h-screen flex">

<!-- ═══════════ 左侧品牌区 ═══════════ -->
<div class="hidden lg:flex lg:w-[45%] xl:w-[50%] relative overflow-hidden flex-col justify-between p-10">
  <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80" alt="" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 bg-gradient-to-br from-ink-950/90 via-ink-950/80 to-ink-950/60"></div>
  <div class="absolute inset-0 star-field"></div>

  <div class="relative z-10">
    <a href="../index.html" class="flex items-center gap-3 w-fit">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 grid place-items-center shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-star-of-david text-ink-950"></i>
      </div>
      <div>
        <div class="font-bold text-zinc-50 leading-tight">天枢市场</div>
        <div class="text-[11px] text-zinc-400">TianShu Market</div>
      </div>
    </a>
  </div>

  <div class="relative z-10 max-w-md">
    <div class="float mb-8">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-400/80 to-brand-600/80 grid place-items-center shadow-2xl shadow-brand-500/30 border border-brand-400/20">
        <i class="fa-solid fa-user-astronaut text-4xl text-white"></i>
      </div>
    </div>
    <h1 class="text-3xl xl:text-4xl font-bold text-white leading-tight mb-4">发现你的<br><span class="text-brand-400">Agent 资产</span></h1>
    <p class="text-sm text-zinc-400 leading-relaxed max-w-sm mb-8">超过 5000+ 角色、技能包、MCP 工具与知识库，助力 Agent 无缝进化。</p>

    <!-- 资产类型展示 -->
    <div class="flex flex-wrap gap-2">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-amber-500/80 to-orange-600/80 grid place-items-center"><i class="fa-solid fa-user-astronaut text-white/90 text-[9px]"></i></span>角色</span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-emerald-500/80 to-teal-600/80 grid place-items-center"><i class="fa-solid fa-wand-magic-sparkles text-white/90 text-[9px]"></i></span>技能</span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-cyan-500/80 to-sky-600/80 grid place-items-center"><i class="fa-solid fa-plug-circle-bolt text-white/90 text-[9px]"></i></span>MCP</span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-teal-500/80 to-emerald-600/80 grid place-items-center"><i class="fa-solid fa-palette text-white/90 text-[9px]"></i></span>主题</span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-indigo-500/80 to-violet-600/80 grid place-items-center"><i class="fa-solid fa-book-open text-white/90 text-[9px]"></i></span>知识库</span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/5 border border-white/10 text-xs text-zinc-300"><span class="w-5 h-5 rounded-md bg-gradient-to-br from-orange-500/80 to-amber-600/80 grid place-items-center"><i class="fa-solid fa-icons text-white/90 text-[9px]"></i></span>图标包</span>
    </div>
  </div>

  <!-- 统计数据 -->
  <div class="relative z-10 flex gap-8">
    <div><div class="text-2xl font-bold text-white">5,000+</div><div class="text-xs text-zinc-500">资产总量</div></div>
    <div><div class="text-2xl font-bold text-white">12 万</div><div class="text-xs text-zinc-500">活跃用户</div></div>
    <div><div class="text-2xl font-bold text-white">98.6%</div><div class="text-xs text-zinc-500">好评率</div></div>
  </div>
</div>

<!-- ═══════════ 右侧表单区 ═══════════ -->
<div class="flex-1 flex items-center justify-center p-6 sm:p-10 relative">
  <!-- 移动端 Logo -->
  <a href="../index.html" class="lg:hidden absolute top-6 left-6 flex items-center gap-2.5 z-10">
    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 grid place-items-center">
      <i class="fa-solid fa-star-of-david text-ink-950 text-xs"></i>
    </div>
    <span class="font-bold text-sm text-zinc-200">天枢市场</span>
  </a>

  <div class="w-full max-w-sm fade-in">
    <!-- 标签切换 -->
    <div class="flex bg-ink-900 rounded-xl p-1 mb-8 border border-zinc-800">
      <button onclick="switchTab('login')" id="tabLogin" class="flex-1 h-10 rounded-lg text-sm font-medium transition bg-brand-500/15 text-brand-300">
        登录
      </button>
      <button onclick="switchTab('register')" id="tabRegister" class="flex-1 h-10 rounded-lg text-sm font-medium transition text-zinc-500 hover:text-zinc-300">
        注册
      </button>
    </div>

    <!-- ═══════════ 登录表单 ═══════════ -->
    <div id="formLogin" class="space-y-5">
      <div>
        <h2 class="text-xl font-bold text-zinc-100 mb-1">欢迎回来</h2>
        <p class="text-sm text-zinc-500">登录以管理你的 Agent 资产</p>
      </div>

      <!-- 第三方登录 -->
      <div class="space-y-2.5">
        <!-- 国内 -->
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.78 4.66l-.7 2.1 2.46-1.23c.78.22 1.6.34 2.46.34.34 0 .68-.02 1-.07A5.95 5.95 0 0 1 10 14c0-3.31 3.13-6 7-6 .34 0 .67.02 1 .07C17.54 5.69 13.82 4 9.5 4Z" fill="#07C160"/><path d="M17.5 8C14.19 8 11.5 10.46 11.5 13.5c0 1.62.78 3.06 2 3.98l-.5 1.5 1.8-.9c.56.15 1.14.22 1.7.22 3.31 0 6-2.46 6-5.5S20.81 8 17.5 8Z" fill="#07C160" opacity=".7"/></svg>
          使用微信登录
        </button>
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Z" fill="#12B7F5"/><path d="M7.5 10.5c.83 0 1.5-.67 1.5-1.5S8.33 7.5 7.5 7.5 6 8.17 6 9s.67 1.5 1.5 1.5Zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5Z" fill="#fff"/><path d="M12 18c-2.28 0-4.22-1.36-5.08-3.3h10.16C16.22 16.64 14.28 18 12 18Z" fill="#fff" opacity=".9"/></svg>
          使用 QQ 登录
        </button>
        <!-- 海外 -->
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          使用 Google 登录
        </button>
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <i class="fa-brands fa-github text-base"></i>
          使用 GitHub 登录
        </button>
      </div>

      <div class="flex items-center gap-3 text-xs text-zinc-600">
        <div class="flex-1 h-px bg-zinc-800"></div>
        <span>或使用邮箱登录</span>
        <div class="flex-1 h-px bg-zinc-800"></div>
      </div>

      <!-- 邮箱 + 密码 -->
      <div class="space-y-3.5">
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">邮箱地址</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="loginEmail" type="email" placeholder="you@example.com"
              class="w-full h-11 pl-10 pr-4 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">密码</label>
          <div class="pw-wrap relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="loginPw" type="password" placeholder="输入密码"
              class="w-full h-11 pl-10 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
            <button onclick="togglePw('loginPw',this)" class="pw-toggle" type="button" aria-label="显示密码">
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 cursor-pointer text-zinc-500 hover:text-zinc-300 transition">
          <input type="checkbox" class="w-4 h-4 rounded border-zinc-700 bg-ink-800 text-brand-500 focus:ring-brand-500/30 cursor-pointer accent-amber-500">
          记住我
        </label>
        <a href="#" class="text-brand-400/80 hover:text-brand-300 transition">忘记密码？</a>
      </div>

      <button onclick="doLogin()" class="w-full h-11 rounded-xl bg-brand-500 hover:bg-brand-400 text-ink-950 font-semibold text-sm shadow-lg shadow-brand-500/25 transition active:scale-[.98] flex items-center justify-center gap-2">
        <span id="loginBtnText">登录</span>
        <i id="loginSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
      </button>
    </div>

    <!-- ═══════════ 注册表单 ═══════════ -->
    <div id="formRegister" class="space-y-5 hidden">
      <div>
        <h2 class="text-xl font-bold text-zinc-100 mb-1">创建账号</h2>
        <p class="text-sm text-zinc-500">加入 12 万+ Agent 开发者社区</p>
      </div>

      <!-- 第三方注册 -->
      <div class="space-y-2.5">
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.08 3.56 2.78 4.66l-.7 2.1 2.46-1.23c.78.22 1.6.34 2.46.34.34 0 .68-.02 1-.07A5.95 5.95 0 0 1 10 14c0-3.31 3.13-6 7-6 .34 0 .67.02 1 .07C17.54 5.69 13.82 4 9.5 4Z" fill="#07C160"/><path d="M17.5 8C14.19 8 11.5 10.46 11.5 13.5c0 1.62.78 3.06 2 3.98l-.5 1.5 1.8-.9c.56.15 1.14.22 1.7.22 3.31 0 6-2.46 6-5.5S20.81 8 17.5 8Z" fill="#07C160" opacity=".7"/></svg>
          使用微信注册
        </button>
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Z" fill="#12B7F5"/><path d="M7.5 10.5c.83 0 1.5-.67 1.5-1.5S8.33 7.5 7.5 7.5 6 8.17 6 9s.67 1.5 1.5 1.5Zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5Z" fill="#fff"/><path d="M12 18c-2.28 0-4.22-1.36-5.08-3.3h10.16C16.22 16.64 14.28 18 12 18Z" fill="#fff" opacity=".9"/></svg>
          使用 QQ 注册
        </button>
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.515 2.7 1.545 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
          使用 Google 注册
        </button>
        <button class="w-full h-11 flex items-center justify-center gap-2.5 rounded-xl bg-zinc-800/80 border border-zinc-800 text-sm text-zinc-300 hover:bg-zinc-700/80 hover:border-zinc-700 transition active:scale-[.98]">
          <i class="fa-brands fa-github text-base"></i>
          使用 GitHub 注册
        </button>
      </div>

      <div class="flex items-center gap-3 text-xs text-zinc-600">
        <div class="flex-1 h-px bg-zinc-800"></div>
        <span>或使用邮箱注册</span>
        <div class="flex-1 h-px bg-zinc-800"></div>
      </div>

      <div class="space-y-3.5">
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">用户名</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="regName" type="text" placeholder="选择一个用户名"
              class="w-full h-11 pl-10 pr-4 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">邮箱地址</label>
          <div class="relative">
            <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="regEmail" type="email" placeholder="you@example.com"
              class="w-full h-11 pl-10 pr-4 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">密码</label>
          <div class="pw-wrap relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="regPw" type="password" placeholder="至少 8 位，含字母和数字"
              class="w-full h-11 pl-10 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
            <button onclick="togglePw('regPw',this)" class="pw-toggle" type="button" aria-label="显示密码">
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
          <!-- 密码强度条 -->
          <div class="flex gap-1 mt-2">
            <div id="pwBar1" class="flex-1 h-1 rounded-full bg-zinc-800 transition-colors"></div>
            <div id="pwBar2" class="flex-1 h-1 rounded-full bg-zinc-800 transition-colors"></div>
            <div id="pwBar3" class="flex-1 h-1 rounded-full bg-zinc-800 transition-colors"></div>
          </div>
          <div id="pwStrength" class="text-[11px] text-zinc-600 mt-1 h-4"></div>
        </div>
        <div>
          <label class="block text-xs text-zinc-500 mb-1.5">确认密码</label>
          <div class="pw-wrap relative">
            <i class="fa-solid fa-shield-halved absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-600 text-sm"></i>
            <input id="regPwConfirm" type="password" placeholder="再次输入密码"
              class="w-full h-11 pl-10 rounded-xl bg-ink-800 border border-zinc-800 text-sm text-zinc-200 placeholder-zinc-600 outline-none input-focus">
          </div>
        </div>
      </div>

      <label class="flex items-start gap-2.5 text-xs text-zinc-500 cursor-pointer">
        <input type="checkbox" id="agreeCheck" class="w-4 h-4 mt-0.5 rounded border-zinc-700 bg-ink-800 text-brand-500 focus:ring-brand-500/30 cursor-pointer accent-amber-500">
        <span>我已阅读并同意 <a href="#" class="text-brand-400/80 hover:text-brand-300">服务协议</a> 和 <a href="#" class="text-brand-400/80 hover:text-brand-300">隐私政策</a></span>
      </label>

      <button onclick="doRegister()" id="regBtn" class="w-full h-11 rounded-xl bg-brand-500 hover:bg-brand-400 text-ink-950 font-semibold text-sm shadow-lg shadow-brand-500/25 transition active:scale-[.98] flex items-center justify-center gap-2">
        <span id="regBtnText">创建账号</span>
        <i id="regSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
      </button>
    </div>

    <!-- 底部链接 -->
    <p class="text-center text-xs text-zinc-600 mt-8">
      <a href="../index.html" class="hover:text-zinc-400 transition"><i class="fa-solid fa-arrow-left mr-1"></i>返回天枢市场</a>
    </p>
  </div>
</div>

<div id="toastWrap" class="fixed bottom-6 right-6 z-[60] space-y-3"></div>

<script>
/* ═══════════════ 工具函数 ═══════════════ */
const $ = s => document.querySelector(s);

function toast(msg, ok=true){
  const t = document.createElement('div');
  t.className = 'toast-in flex items-center gap-3 px-4 py-3 rounded-xl border text-sm shadow-2xl shadow-black/50 glass '+(ok?'bg-emerald-500/15 border-emerald-500/30 text-emerald-300':'bg-rose-500/15 border-rose-500/30 text-rose-300');
  t.innerHTML = `<i class="fa-solid ${ok?'fa-circle-check':'fa-circle-exclamation'}"></i><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='all .3s'; t.style.opacity='0'; t.style.transform='translateX(24px)'; setTimeout(()=>t.remove(),300); },2600);
}

/* ═══════════════ 标签切换 ═══════════════ */
function switchTab(tab) {
  const isLogin = tab === 'login';
  $('#tabLogin').className = isLogin ? 'flex-1 h-10 rounded-lg text-sm font-medium transition bg-brand-500/15 text-brand-300' : 'flex-1 h-10 rounded-lg text-sm font-medium transition text-zinc-500 hover:text-zinc-300';
  $('#tabRegister').className = !isLogin ? 'flex-1 h-10 rounded-lg text-sm font-medium transition bg-brand-500/15 text-brand-300' : 'flex-1 h-10 rounded-lg text-sm font-medium transition text-zinc-500 hover:text-zinc-300';
  $('#formLogin').classList.toggle('hidden', !isLogin);
  $('#formRegister').classList.toggle('hidden', isLogin);
}

/* ═══════════════ 密码可见切换 ═══════════════ */
function togglePw(inputId, btn) {
  const input = $(`#${inputId}`);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fa-regular fa-eye-slash text-sm';
  } else {
    input.type = 'password';
    icon.className = 'fa-regular fa-eye text-sm';
  }
}

/* ═══════════════ 密码强度 ═══════════════ */
$('#regPw')?.addEventListener('input', function() {
  const v = this.value;
  let score = 0;
  if (v.length >= 8) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;

  const colors = ['bg-rose-500','bg-amber-500','bg-emerald-500'];
  const labels = ['弱','中等','强'];
  const textColors = ['text-rose-400','text-amber-400','text-emerald-400'];

  for (let i = 1; i <= 3; i++) {
    const bar = $(`#pwBar${i}`);
    bar.className = 'flex-1 h-1 rounded-full transition-colors ' + (i <= score ? colors[score-1] : 'bg-zinc-800');
  }
  $('#pwStrength').textContent = v.length ? labels[score-1] || '弱' : '';
  $('#pwStrength').className = 'text-[11px] mt-1 h-4 ' + (score ? textColors[score-1] : 'text-zinc-600');
});

/* ═══════════════ 登录 ═══════════════ */
function doLogin() {
  const email = $('#loginEmail').value.trim();
  const pw = $('#loginPw').value.trim();

  if (!email) { toast('请输入邮箱地址', false); $('#loginEmail').focus(); return; }
  if (!pw) { toast('请输入密码', false); $('#loginPw').focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('邮箱格式不正确', false); return; }

  $('#loginBtnText').textContent = '';
  $('#loginSpinner').classList.remove('hidden');

  MarketAPI.login(email, pw)
    .then(data => {
      MarketAPI.afterAuth(data);
      $('#loginBtnText').textContent = '登录';
      $('#loginSpinner').classList.add('hidden');
      toast('登录成功，正在跳转…');
      setTimeout(()=>{ window.location.href = '../index.html'; }, 600);
    })
    .catch(e => {
      $('#loginBtnText').textContent = '登录';
      $('#loginSpinner').classList.add('hidden');
      toast(e.message || '登录失败', false);
    });
}

/* ═══════════════ 注册 ═══════════════ */
function doRegister() {
  const name = $('#regName').value.trim();
  const email = $('#regEmail').value.trim();
  const pw = $('#regPw').value;
  const pw2 = $('#regPwConfirm').value;
  const agreed = $('#agreeCheck').checked;

  if (!name) { toast('请输入用户名', false); $('#regName').focus(); return; }
  if (name.length < 2) { toast('用户名至少 2 个字符', false); return; }
  if (!email) { toast('请输入邮箱地址', false); $('#regEmail').focus(); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('邮箱格式不正确', false); return; }
  if (pw.length < 8) { toast('密码至少 8 位', false); $('#regPw').focus(); return; }
  if (pw !== pw2) { toast('两次密码不一致', false); $('#regPwConfirm').focus(); return; }
  if (!agreed) { toast('请先同意服务协议', false); return; }

  $('#regBtnText').textContent = '';
  $('#regSpinner').classList.remove('hidden');

  MarketAPI.register(name, email, pw)
    .then(data => {
      MarketAPI.afterAuth(data);
      $('#regBtnText').textContent = '创建账号';
      $('#regSpinner').classList.add('hidden');
      toast('注册成功，欢迎加入天枢！');
      setTimeout(()=>{ window.location.href = '../index.html'; }, 600);
    })
    .catch(e => {
      $('#regBtnText').textContent = '创建账号';
      $('#regSpinner').classList.add('hidden');
      toast(e.message || '注册失败', false);
    });
}

/* ═══════════════ Enter 键提交 ═══════════════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!$('#formLogin').classList.contains('hidden')) doLogin();
    else if (!$('#formRegister').classList.contains('hidden')) doRegister();
  }
});
</script>
</body>
</html>
