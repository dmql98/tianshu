  .card-out{opacity:0 !important;transform:scale(.94) !important}
  .toast-in{animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both}@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

              const na = document.getElementById('navAdmin');
              if (na && u.role === 'admin') na.classList.remove('hidden');
              wrap.innerHTML = '<div class="flex items-center gap-3 px-1"><img src="'+(u.avatar||'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80')+'" alt="头像" class="w-8 h-8 rounded-full object-cover ring-2 ring-zinc-700"><div class="min-w-0 flex-1"><div class="text-sm font-medium text-zinc-200 truncate">'+u.name+'</div><div class="text-[11px] text-zinc-500">已安装 '+u.installed+' 个资产</div></div><button onclick="MarketAPI.logout();location.reload();" class="w-8 h-8 rounded-lg bg-ink-800 border border-zinc-800 grid place-items-center text-zinc-500 hover:text-zinc-300 hover:border-zinc-700 transition" title="退出登录"><i class="fa-solid fa-right-from-bracket text-xs"></i></button><a href="uploads.html" class="w-8 h-8 rounded-lg bg-brand-500/15 border border-brand-500/30 grid place-items-center text-brand-300 hover:bg-brand-500/25 transition" title="上传资产"><i class="fa-solid fa-cloud-arrow-up text-xs"></i></a></div>';
            }).catch(()=>{ MarketAPI.logout(); location.reload(); })
          : (wrap.innerHTML = '<a href="login.html" class="flex items-center justify-center gap-2 h-10 rounded-xl bg-brand-500/15 border border-brand-500/30 text-brand-300 text-sm font-medium hover:bg-brand-500/25 transition active:scale-95"><i class="fa-solid fa-right-to-bracket text-xs"></i>登录 / 注册</a>');
      })();

      </div>

<div id="toastWrap" class="fixed bottom-6 right-6 z-[60] space-y-3"></div>

<script>
const CATS = {
  character:{ name:'角色',   icon:'fa-solid fa-user-astronaut', grad:'from-amber-500/80 to-orange-600/80' },
  skin:{     name:'皮肤',   icon:'fa-solid fa-shirt',          grad:'from-rose-500/80 to-pink-600/80' },
  skill:{    name:'技能',   icon:'fa-solid fa-wand-magic-sparkles', grad:'from-emerald-500/80 to-teal-600/80' },
  tool:{     name:'工具',   icon:'fa-solid fa-screwdriver-wrench',  grad:'from-sky-500/80 to-blue-600/80' },
  mcp:{      name:'MCP',    icon:'fa-solid fa-plug-circle-bolt',    grad:'from-cyan-500/80 to-sky-600/80' },
  kb:{       name:'知识库', icon:'fa-solid fa-book-open',      grad:'from-indigo-500/80 to-violet-600/80' },
  theme:{    name:'主题',   icon:'fa-solid fa-palette',        grad:'from-teal-500/80 to-emerald-600/80' },
  iconpack:{ name:'图标包', icon:'fa-solid fa-icons',          grad:'from-orange-500/80 to-amber-600/80' },
};
const AV = [
  'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80',
  'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=80&q=80',
  'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=80&q=80',
];
let FAVS = [];
const fmt = n => n >= 10000 ? (n/10000).toFixed(1)+' 万' : n >= 1000 ? (n/1000).toFixed(1)+'k' : n;
async function loadFAVS(){
  if (!MarketAPI.isLoggedIn()) { FAVS = []; renderAll(); return; }
  try {
    const list = await MarketAPI.myFavs();
    // 补充展示字段（av/dl 由后端数据映射）
    FAVS = list.map(a => ({
      id: a.id, cat: a.cat, name: a.name, author: a.author, rate: a.rate,
      dl: fmt(a.dl), desc: a.desc, av: (a.id||0) % 3,
    }));
  } catch(e) { toast(e.message, false); }
  renderAll();
}
let curChip = 'all';
const $ = s => document.querySelector(s);

function toast(msg, ok=true){
  const t = document.createElement('div');
  t.className = 'toast-in flex items-center gap-3 px-4 py-3 rounded-xl border text-sm shadow-2xl shadow-black/50 glass ' + (ok ? 'bg-emerald-500/15 border-emerald-500/30 text-emerald-300' : 'bg-rose-500/15 border-rose-500/30 text-rose-300');
  t.innerHTML = `<i class="fa-solid ${ok?'fa-circle-check':'fa-circle-exclamation'}"></i><span>${msg}</span>`;
  $('#toastWrap').appendChild(t);
  setTimeout(()=>{ t.style.transition='all .3s'; t.style.opacity='0'; t.style.transform='translateX(24px)'; setTimeout(()=>t.remove(),300); }, 2600);
}
function renderChips(){
  const present = [...new Set(FAVS.map(a=>a.cat))];
  const all = [['all','全部'], ...present.map(k=>[k, CATS[k].name])];
  $('#chips').innerHTML = all.map(([k,n])=>{
    const cnt = k==='all' ? FAVS.length : FAVS.filter(a=>a.cat===k).length;
    const on = curChip===k;
    return `<button onclick="curChip='${k}';renderAll()" class="h-8 px-3.5 rounded-lg text-xs font-medium transition active:scale-95 ${on?'bg-brand-500/15 border border-brand-500/40 text-brand-300':'bg-ink-900 border border-zinc-800 text-zinc-400 hover:border-zinc-600'}">${n} <span class="${on?'text-brand-400/70':'text-zinc-600'} ml-0.5">${cnt}</span></button>`;
  }).join('');
}
function cardHTML(a, i){
  const c = CATS[a.cat];
  return `
  <article class="card-lift fade-in group bg-ink-900 border border-zinc-800 hover:border-brand-500/40 rounded-2xl overflow-hidden hover:shadow-xl hover:shadow-brand-500/5" style="animation-delay:${i*40}ms" data-card="${a.id}">
    <div class="h-36 relative overflow-hidden bg-gradient-to-br ${c.grad}">
      <div class="absolute inset-0 star-field opacity-60"></div>
      <i class="${c.icon} absolute inset-0 grid place-items-center text-5xl text-white/80 drop-shadow-lg"></i>
      <span class="absolute top-3 left-3 px-2 py-0.5 rounded-md bg-black/40 glass text-[11px] text-white/90 font-medium">${c.name}</span>
      <button onclick="unfav(${a.id})" title="取消收藏" class="absolute top-3 right-3 w-8 h-8 rounded-lg bg-black/40 glass grid place-items-center text-rose-400 hover:text-zinc-300 hover:scale-110 active:scale-95 transition">
        <i class="fa-solid fa-heart"></i>
      </button>
    </div>
    <div class="p-4">
      <h3 class="font-semibold text-zinc-100 truncate group-hover:text-brand-300 transition">${a.name}</h3>
      <p class="text-xs text-zinc-500 mt-1.5 line-clamp-2 leading-relaxed h-8">${a.desc}</p>
      <div class="flex items-center gap-2 mt-3">
        <img src="${AV[a.av]}" alt="${a.author}" class="w-5 h-5 rounded-full object-cover">
        <span class="text-xs text-zinc-500 truncate">${a.author}</span>
        <span class="ml-auto flex items-center gap-1 text-xs text-amber-400/90"><i class="fa-solid fa-star text-[10px]"></i>${a.rate}</span>
      </div>
      <div class="flex items-center justify-between mt-3.5 pt-3.5 border-t border-zinc-800/80">
        <span class="text-xs text-zinc-500"><i class="fa-solid fa-download mr-1"></i>${a.dl}</span>
        <a href="../index.html" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-brand-500/15 text-brand-300 border border-brand-500/30 hover:bg-brand-500/25 transition active:scale-95">查看市场页</a>
      </div>
    </div>
  </article>`;
}
function emptyHTML(){
  return `<div class="col-span-full flex flex-col items-center justify-center py-24 fade-in">
    <div class="w-16 h-16 rounded-2xl bg-ink-800 border border-zinc-800 grid place-items-center mb-5"><i class="fa-regular fa-heart text-2xl text-zinc-600"></i></div>
    <h3 class="font-semibold text-zinc-300 mb-2">收藏夹空空如也</h3>
    <p class="text-sm text-zinc-500 mb-6">在市场看到心动资产时，点亮右上角的小心心</p>
    <a href="../index.html" class="h-9 px-5 rounded-lg bg-brand-500 hover:bg-brand-400 text-ink-950 font-semibold text-sm transition active:scale-95 flex items-center">去市场逛逛</a>
  </div>`;
}
function renderAll(){
  const list = curChip==='all' ? FAVS : FAVS.filter(a=>a.cat===curChip);
  renderChips();
  $('#navCount').textContent = FAVS.length;
  $('#subTitle').textContent = FAVS.length ? `共 ${FAVS.length} 项收藏 · 心动资产随时取用` : '心动资产，随时取用';
  $('#grid').innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML();
}
function unfav(id){
  const a = FAVS.find(x=>x.id===id);
  const card = document.querySelector(`[data-card="${id}"]`);
  if (card) card.classList.add('card-out');
  setTimeout(()=>{
    MarketAPI.unfav(id).then(()=>{
      FAVS = FAVS.filter(x=>x.id!==id);
      if (curChip!=='all' && !FAVS.find(x=>x.cat===curChip)) curChip='all';
      renderAll();
      toast(`已取消收藏「${a.name}」`);
    }).catch(e=>{ toast(e.message,false); if(card) card.classList.remove('card-out'); });
  }, 280);
}
loadFAVS();
</script>
