appId: cn.tianshu.desktop
productName: 天枢
asar: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

extraResources:
  - from: runtime
    to: runtime
  # `from: staging` (not staging/server) so server/node_modules is a
  # sub-node_modules and survives electron-builder's root node_modules filter.
  - from: staging
    to: .
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/package-lock.json'

# ── Windows（§2.1/§9.1）────────────────────────────────────────────
# 保留旧 artifactName（TianShu-Setup-<version>-x64.exe），维持历史差分更新链。
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: TianShu-Setup-${version}-${arch}.${ext}

# ── macOS（§2.2/§9.1/§9.2）──────────────────────────────────────────
# 首版两个独立包（mac-x64 / mac-arm64），不做 Universal App。
# DMG 是新用户入口，ZIP 是 electron-updater 载荷（latest-mac.yml 必须含两者）。
# 正式发布在 CI 通过 -c.mac.notarize=true 启用公证（§9.2）；本地无证书构建
# 保持 notarize: false，避免强行公证失败。签名/公证凭据只来自 CI secrets。
#
# 注意：target 不要显式写 arch 数组！electron-builder 的 CLI --x64/--arm64
# 不会覆盖 target 中显式声明的 arch 列表——若写 [x64, arm64]，build-macos-x64
# job 会同时构建两个架构，latest-mac.yml 混入 arm64 zip 导致 assemble-release
# size mismatch 失败（v0.8.1 事故根因）。架构由 CI 命令 --x64/--arm64 控制。
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: TianShu-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  notarize: false
  # macOS 正式包需要 icon.icns（§9.3）：当前仓库只有 icon.ico/icon.png，
  # .icns 需在 macOS 主机从高分辨率源图生成（外部前置条件），
  # 生成后放入 assets/icon.icns；缺失时 electron-builder 使用默认图标并警告。

# ── Linux（§2.3/§9.1）───────────────────────────────────────────────
# 首版以 x64 AppImage 为正式自动更新渠道；.deb 仅作为安装便利包，
# 不承诺通过 electron-updater 自更新。
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # electron-builder 会按目标格式改写 ${arch}：AppImage x64 -> x86_64，
  # deb x64 -> amd64。公开发布名是 updater 协议的一部分，因此不使用该宏。

appImage:
  artifactName: TianShu-${version}-linux-x64.${ext}

deb:
  artifactName: TianShu-${version}-linux-x64.${ext}

# 更新源：官网优先，GitHub 兜底。
#   - 第一个 publish 配置（generic → https://www.tianshuapp.tech/updates）会写入
#     app-update.yml，作为客户端默认更新源（官网优先）。
#   - GitHub 同时保留为发布镜像与兜底源：官网缺失文件时由 Nginx 302 到 GitHub；
#     客户端在官网源检查失败时也会自动切换 GitHub 重试（见 src/updater.ts fallbackFeed）。
# 注意：electron-builder 只会把 publishConfigs[0] 写入 app-update.yml，
#       CI 上传仍由工作流 gh release upload 完成，不受此处影响。
publish:
  - provider: generic
    url: https://www.tianshuapp.tech/updates
  - provider: github
    owner: dmql98
    repo: tianshu
    releaseType: release

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 天枢
  uninstallDisplayName: 天枢
  # ASCII-safe artifact names come from artifactName; the display name may use
  # the Chinese product name. Data in %APPDATA% is intentionally preserved on
  # uninstall (deleteAppDataOnUninstall: false).
