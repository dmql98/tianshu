<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天枢 · 角色中心</title>
<style>
:root{
  --canvas:#f5f0e8; --surface1:#ede6da; --surface2:#e0d8cc; --surfaceHover:#e0d8cc;
  --input:#faf8f4; --overlay:rgba(44,36,24,0.4); --border:rgba(180,160,130,0.18);
  --borderSubtle:rgba(180,160,130,0.10); --textPrimary:#2c2418; --textSecondary:#5c5040;
  --textMuted:#8a7d68; --textFaint:#b8a890; --textOnAccent:#ffffff; --accent:#c8960a;
  --accentHover:#b08508; --accentSoft:rgba(200,150,10,0.12); --link:#c8960a;
  --focusRing:rgba(200,150,10,0.55); --success:#2a9d5c; --warning:#d97706; --danger:#c45c3c;
  --info:#2563eb; --shadowColor:rgba(44,36,24,0.18); --codeBg:#faf8f4; --scrollbar:#b8a890;
  --radius:10px;
}
[data-theme="dark"]{
  --canvas:#17130e; --surface1:#201b14; --surface2:#2a2319; --surfaceHover:#32291d;
  --input:#1c1710; --overlay:rgba(0,0,0,0.55); --border:rgba(255,235,200,0.12);
  --borderSubtle:rgba(255,235,200,0.07); --textPrimary:#f2ead9; --textSecondary:#c9bda6;
  --textMuted:#998d78; --textFaint:#6b6253; --textOnAccent:#17130e; --accent:#e0b341;
  --accentHover:#f0c35c; --accentSoft:rgba(224,179,65,0.16); --link:#e0b341;
  --focusRing:rgba(224,179,65,0.6); --success:#4caf7d; --warning:#e8933c; --danger:#e0735a;
  --info:#6b9ff3; --shadowColor:rgba(0,0,0,0.5); --codeBg:#17130e; --scrollbar:#4a4134;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--canvas); color:var(--textPrimary);
  font-family:"LXGW WenKai","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.app{display:flex; flex-direction:column; height:100vh; overflow:hidden}
/* ---------- 顶栏 ---------- */
.topbar{
  display:flex; align-items:center; gap:14px; padding:10px 18px;
  background:var(--surface1); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:9px; font-weight:700; font-size:16px}
.brand .logo{
  width:30px; height:30px; border-radius:8px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accentHover)); color:#fff; font-weight:800;
}
.crumb{color:var(--textMuted); font-size:13px}
.crumb b{color:var(--textPrimary)}
.header-search{
  margin-left:auto; display:flex; align-items:center; gap:6px; background:var(--input);
  border:1px solid var(--border); border-radius:8px; padding:5px 10px; min-width:220px;
}
.header-search input{border:none; background:transparent; outline:none; color:var(--textPrimary); width:100%; font-family:inherit}
.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border);
  background:var(--surface2); color:var(--textPrimary); border-radius:8px; padding:6px 12px;
  cursor:pointer; font-family:inherit; font-size:13px; transition:.15s;
}
.btn:hover{background:var(--surfaceHover)}
.btn.primary{background:var(--accent); color:var(--textOnAccent); border-color:var(--accent)}
.btn.primary:hover{background:var(--accentHover)}
.btn:disabled{opacity:.5; cursor:not-allowed}
.icon-btn{background:transparent; border:none; color:var(--textMuted); cursor:pointer; padding:5px; border-radius:6px; display:inline-grid; place-items:center}
.icon-btn:hover{background:var(--surfaceHover); color:var(--textPrimary)}
/* 三域切换 */
.domain-switch{display:inline-flex; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:3px}
.domain-switch button{border:none; background:transparent; padding:6px 15px; border-radius:7px; cursor:pointer; font-family:inherit; font-size:13.5px; color:var(--textSecondary); transition:.15s}
.domain-switch button:hover{color:var(--textPrimary)}
.domain-switch button.active{background:var(--accent); color:var(--textOnAccent); font-weight:600}
/* ---------- 主体 ---------- */
.body{display:flex; flex:1; min-height:0}
.sidebar{
  width:264px; flex:none; background:var(--surface1); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:auto;
}
.side-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px}
.side-title{font-weight:700; font-size:14px}
.kb-list{display:flex; flex-direction:column; gap:6px; padding:4px 10px 16px}
.kb-card{
  border:1px solid var(--border); background:var(--surface2); border-radius:10px;
  padding:10px 12px; cursor:pointer; transition:.15s;
}
.kb-card:hover{border-color:var(--accent)}
.kb-card.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accentSoft)}
.kb-name{font-weight:600; display:flex; align-items:center; gap:7px}
.kb-desc{color:var(--textMuted); font-size:12px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kb-meta{display:flex; align-items:center; gap:6px; margin-top:8px; flex-wrap:wrap}
.kb-manage{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap}
.badge{font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); color:var(--textSecondary); background:var(--input)}
.badge.global{color:var(--info); border-color:rgba(37,99,235,.3); background:rgba(37,99,235,.08)}
.badge.department{color:var(--warning); border-color:rgba(217,119,6,.3); background:rgba(217,119,6,.08)}
.badge.user{color:var(--success); border-color:rgba(42,157,92,.3); background:rgba(42,157,92,.08)}
.stat-pill{font-size:11px; color:var(--textMuted); display:inline-flex; align-items:center; gap:4px}
.main{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--canvas)}
.tabs{display:flex; gap:4px; padding:10px 18px 0; border-bottom:1px solid var(--border); background:var(--surface1); flex-wrap:wrap}
.tab{
  padding:9px 16px; cursor:pointer; color:var(--textMuted); border:1px solid transparent;
  border-bottom:none; border-radius:8px 8px 0 0; font-size:13.5px; transition:.15s;
}
.tab:hover{color:var(--textPrimary)}
.tab.active{color:var(--textPrimary); background:var(--canvas); border-color:var(--border); font-weight:600}
.tab-body{flex:1; min-height:0; overflow:auto; padding:18px}
/* ---------- 文件三栏 ---------- */
.files-wrap{display:grid; grid-template-columns:200px 1fr 360px; gap:14px; height:100%}
.panel{background:var(--surface1); border:1px solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; min-height:0; overflow:hidden}
.panel-head{padding:11px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; font-weight:600; font-size:13.5px}
.panel-body{overflow:auto; padding:8px}
.tree-item{display:flex; align-items:center; gap:7px; padding:7px 9px; border-radius:7px; cursor:pointer; color:var(--textSecondary); font-size:13px}
.tree-item:hover{background:var(--surfaceHover)}
.tree-item.active{background:var(--accentSoft); color:var(--textPrimary)}
.tree-item.child{margin-left:14px; font-size:12.5px}
.doc-row{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
  border:1px solid transparent; cursor:pointer;
}
.doc-row:hover{background:var(--surface2)}
.doc-row.active{background:var(--accentSoft); border-color:var(--accent)}
.doc-ic{width:30px; height:30px; border-radius:7px; background:var(--surface2); display:grid; place-items:center; color:var(--accent); flex:none}
.doc-main{flex:1; min-width:0}
.doc-name{font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.doc-sub{font-size:11.5px; color:var(--textMuted); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tag{font-size:10.5px; padding:0 6px; border-radius:5px; background:var(--surface2); color:var(--textMuted); border:1px solid var(--border)}
.st{font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap}
.st.indexed{color:var(--success); background:rgba(42,157,92,.10); border:1px solid rgba(42,157,92,.3)}
.st.parsing,.st.indexing{color:var(--warning); background:rgba(217,119,6,.10); border:1px solid rgba(217,119,6,.3)}
.st.pending{color:var(--textMuted); background:var(--surface2); border:1px solid var(--border)}
.st.error{color:var(--danger); background:rgba(196,92,60,.10); border:1px solid rgba(196,92,60,.3)}
.row-actions{display:flex; gap:4px; opacity:0; transition:.15s}
.doc-row:hover .row-actions{opacity:1}
.mini-btn{border:1px solid var(--border); background:var(--input); border-radius:6px; padding:3px 7px; font-size:11.5px; cursor:pointer; color:var(--textSecondary)}
.mini-btn:hover{background:var(--surfaceHover); color:var(--textPrimary)}
.mini-btn.danger{color:var(--danger)}
.mini-btn.on{background:var(--accentSoft); border-color:var(--accent); color:var(--textPrimary)}
.empty{display:grid; place-items:center; height:100%; color:var(--textFaint); text-align:center; gap:6px; padding:20px}
.empty .big{font-size:34px; opacity:.5}
.dropzone{border:1.5px dashed var(--border); border-radius:10px; padding:16px; text-align:center; color:var(--textMuted); background:var(--surface2); margin-bottom:12px; cursor:pointer; transition:.15s}
.dropzone:hover{border-color:var(--accent); color:var(--textPrimary)}
/* 预览 */
.preview-body{padding:14px; overflow:auto}
.preview-title{font-size:15px; font-weight:700; margin-bottom:4px}
.preview-anchor{font-size:12px; color:var(--info); margin-bottom:10px}
.md h1,.md h2,.md h3{margin:.6em 0 .3em; line-height:1.4}
.md h1{font-size:18px; border-bottom:1px solid var(--border); padding-bottom:4px}
.md h2{font-size:15.5px}
.md h3{font-size:14px}
.md p{margin:.4em 0}
.md code{background:var(--codeBg); border:1px solid var(--border); padding:1px 5px; border-radius:5px; font-family:"SFMono-Regular",Consolas,monospace; font-size:12.5px; color:var(--danger)}
.md pre{background:var(--codeBg); border:1px solid var(--border); padding:10px; border-radius:8px; overflow:auto}
.md ul{margin:.3em 0; padding-left:20px}
.meta-grid{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; color:var(--textSecondary); margin-top:12px; border-top:1px dashed var(--border); padding-top:10px}
.meta-grid b{color:var(--textPrimary); font-weight:600}
.chunk-config{margin-top:12px; border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:var(--surface2)}
.chunk-config .row{display:flex; align-items:center; gap:10px; margin:7px 0}
.chunk-config label{font-size:12.5px; color:var(--textSecondary); min-width:84px}
select,input[type=text],input[type=number],textarea{
  font-family:inherit; font-size:13px; color:var(--textPrimary); background:var(--input);
  border:1px solid var(--border); border-radius:7px; padding:6px 9px; outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accentSoft)}
/* 分块预设 */
.preset-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px}
.preset{border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; background:var(--input); transition:.15s}
.preset:hover{border-color:var(--accent)}
.preset.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accentSoft)}
.preset .pn{font-weight:600; font-size:13px}
.preset .pd{font-size:11.5px; color:var(--textMuted); margin-top:2px}
.merge-note{font-size:11.5px; color:var(--textMuted); margin-top:9px; border-top:1px dashed var(--border); padding-top:9px; line-height:1.6}
/* 后端 schema 示意 */
.schema-panel{border:1px solid var(--border); border-radius:9px; background:var(--surface2); padding:10px 12px; margin-top:10px}
.schema-panel summary{cursor:pointer; font-size:12.5px; color:var(--textSecondary); font-weight:600}
.schema-json{background:var(--codeBg); border:1px solid var(--border); border-radius:7px; padding:9px; font-family:"SFMono-Regular",Consolas,monospace; font-size:11.5px; white-space:pre; overflow:auto; color:var(--textSecondary); margin-top:8px}
/* ---------- 检索调试 ---------- */
.debug-wrap{display:grid; grid-template-columns:320px 1fr; gap:14px; height:100%}
.cfg{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface1); padding:12px 14px; overflow:auto}
.cfg h4{margin:2px 0 10px; font-size:13.5px}
.field{margin:11px 0}
.field > label{display:block; font-size:12.5px; color:var(--textSecondary); margin-bottom:4px}
.field .hint{font-size:11px; color:var(--textFaint); margin-top:3px}
.switch{display:inline-flex; align-items:center; gap:8px; cursor:pointer}
.switch input{display:none}
.slider{width:42px; height:22px; border-radius:999px; background:var(--surface2); border:1px solid var(--border); position:relative; transition:.15s}
.slider::after{content:""; position:absolute; width:16px; height:16px; border-radius:50%; background:var(--textMuted); top:2px; left:2px; transition:.15s}
.switch input:checked + .slider{background:var(--accentSoft); border-color:var(--accent)}
.switch input:checked + .slider::after{background:var(--accent); left:22px}
.range-row{display:flex; align-items:center; gap:8px}
.range-row input[type=range]{flex:1; accent-color:var(--accent)}
.range-val{font-size:12px; color:var(--textSecondary); min-width:38px; text-align:right}
.query-pane{display:flex; flex-direction:column; min-height:0}
.query-box{background:var(--surface1); border:1px solid var(--border); border-radius:var(--radius); padding:12px}
.query-box textarea{width:100%; resize:vertical; min-height:64px}
.qb-actions{display:flex; align-items:center; gap:9px; margin-top:9px}
.qb-actions .spacer{margin-left:auto}
.toggle-raw{display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden}
.toggle-raw button{border:none; background:var(--surface2); padding:5px 12px; cursor:pointer; font-family:inherit; font-size:12.5px; color:var(--textSecondary)}
.toggle-raw button.active{background:var(--accent); color:var(--textOnAccent)}
.results{flex:1; overflow:auto; margin-top:12px; display:flex; flex-direction:column; gap:10px}
.result-card{border:1px solid var(--border); border-radius:9px; background:var(--surface1); padding:11px 13px; cursor:pointer; transition:.15s}
.result-card:hover{border-color:var(--accent)}
.rc-head{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--textMuted); margin-bottom:6px; flex-wrap:wrap}
.rc-idx{font-weight:700; color:var(--accent)}
.rc-score{color:var(--success); font-weight:600}
.rc-rerank{color:var(--info)}
.rc-content{font-size:13.5px; color:var(--textPrimary)}
.rc-source{color:var(--info); font-size:12px}
.raw-json{background:var(--codeBg); border:1px solid var(--border); border-radius:9px; padding:12px; font-family:"SFMono-Regular",Consolas,monospace; font-size:12.5px; white-space:pre; overflow:auto; color:var(--textSecondary)}
.no-res{padding:30px; text-align:center; color:var(--textFaint)}
/* ---------- 引用预览（对话） ---------- */
.chat{max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:14px}
.msg{display:flex; gap:10px}
.msg .av{width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center; font-weight:700; font-size:13px}
.msg.user .av{background:var(--surface2); color:var(--textPrimary)}
.msg.bot .av{background:linear-gradient(135deg,var(--accent),var(--accentHover)); color:#fff}
.bubble{background:var(--surface1); border:1px solid var(--border); border-radius:10px; padding:11px 14px; max-width:660px}
.bubble .who{font-size:11.5px; color:var(--textMuted); margin-bottom:4px}
.tool-card{border:1px solid var(--border); border-radius:10px; background:var(--surface1); overflow:hidden; margin-top:8px}
.tool-head{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface2); font-size:13px; font-weight:600}
.tool-head .dot{width:8px; height:8px; border-radius:50%; background:var(--accent)}
.tool-body{padding:11px 13px; display:flex; flex-direction:column; gap:9px}
.ref-link{color:var(--link); font-size:12.5px; text-decoration:none; display:inline-flex; align-items:center; gap:5px}
.ref-link:hover{text-decoration:underline}
.graph-block{border:1px dashed var(--border); border-radius:9px; padding:10px 12px; background:var(--surface2)}
.graph-block .gt{font-size:12px; font-weight:700; color:var(--textSecondary); margin-bottom:6px}
.entity{display:inline-flex; align-items:center; gap:6px; background:var(--input); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:12px; margin:3px 4px 0 0}
.entity .et{font-size:10.5px; color:var(--accent); background:var(--accentSoft); border-radius:5px; padding:0 5px}
.rel{font-size:12px; color:var(--textSecondary); padding:3px 0}
.rel .arr{color:var(--muted); margin:0 5px}
/* ---------- 图谱探索 ---------- */
.graph-wrap{display:grid; grid-template-columns:1fr 320px; gap:14px; height:100%}
.graph-canvas{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface1); overflow:auto; padding:16px}
.gnode{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--input); border-radius:999px; padding:5px 12px; font-size:12.5px; margin:6px; cursor:pointer; transition:.15s}
.gnode:hover{border-color:var(--accent)}
.gnode.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accentSoft)}
.gnode .gt{font-size:10px; padding:0 5px; border-radius:4px; background:var(--accentSoft); color:var(--accent)}
.gedges{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface1); padding:12px; overflow:auto}
.gedge{font-size:12.5px; color:var(--textSecondary); padding:5px 0; border-bottom:1px dashed var(--borderSubtle)}
.gedge .arr{color:var(--accent); margin:0 6px}
.graph-kpis{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap}
/* ---------- 评测 ---------- */
.kpi-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.kpi{border:1px solid var(--border); border-radius:10px; background:var(--surface1); padding:11px 15px; min-width:128px}
.kpi .kv{font-size:21px; font-weight:700}
.kpi .kl{font-size:11.5px; color:var(--textMuted)}
.eval-table{width:100%; border-collapse:collapse; font-size:12.5px}
.eval-table th,.eval-table td{border:1px solid var(--border); padding:7px 9px; text-align:center}
.eval-table th{background:var(--surface2); font-weight:600}
.eval-table td.q{text-align:left}
.eval-good{color:var(--success); font-weight:600}
.eval-mid{color:var(--warning); font-weight:600}
.eval-bad{color:var(--danger); font-weight:600}
.eval-note{font-size:12px; color:var(--textMuted); margin-top:10px; line-height:1.7}
/* ---------- 记忆中心 ---------- */
.mem-list{display:flex; flex-direction:column; gap:10px}
.mem-item{border:1px solid var(--border); border-radius:10px; background:var(--surface1); padding:11px 13px}
.mem-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mem-type{font-size:10.5px; padding:1px 7px; border-radius:5px; background:var(--accentSoft); color:var(--accent)}
.mem-status{font-size:10.5px; padding:1px 7px; border-radius:999px; border:1px solid var(--border)}
.mem-status.active{color:var(--success); background:rgba(42,157,92,.10); border-color:rgba(42,157,92,.3)}
.mem-status.candidate{color:var(--info); background:rgba(37,99,235,.08); border-color:rgba(37,99,235,.3)}
.mem-status.conflict{color:var(--danger); background:rgba(196,92,60,.10); border-color:rgba(196,92,60,.3)}
.mem-status.superseded{color:var(--textMuted); background:var(--surface2)}
.mem-status.expired{color:var(--warning); background:rgba(217,119,6,.08); border-color:rgba(217,119,6,.3)}
.mem-content{margin:7px 0; font-size:13.5px}
.mem-meta{font-size:11.5px; color:var(--textMuted); display:flex; gap:12px; flex-wrap:wrap}
.mem-actions{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:7px; overflow:hidden}
.seg button{border:none; background:var(--surface2); padding:5px 11px; cursor:pointer; font-family:inherit; font-size:12px; color:var(--textSecondary)}
.seg button.active{background:var(--accent); color:var(--textOnAccent)}
/* 权限/装配 */
.loadout{display:flex; flex-direction:column; gap:8px}
.loadout-row{display:flex; align-items:center; gap:10px; border:1px solid var(--border); border-radius:9px; padding:10px 12px; background:var(--surface1)}
.loadout-row .ln{flex:1}
.loadout-row .ld{font-size:11.5px; color:var(--textMuted)}
/* 审计 */
.audit-list{display:flex; flex-direction:column; gap:6px}
.audit-row{border:1px solid var(--border); border-radius:8px; padding:8px 11px; background:var(--surface1); font-size:12.5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.audit-row .at{color:var(--textMuted); font-size:11.5px; font-family:"SFMono-Regular",Consolas,monospace}
.audit-row .aa{color:var(--accent); font-weight:600}
/* 通用 */
.placeholder{display:grid; place-items:center; height:100%; color:var(--textMuted); text-align:center; gap:10px; padding:30px}
.placeholder .big{font-size:40px; opacity:.5}
.note-box{border:1px solid var(--border); border-radius:9px; background:var(--surface2); padding:11px 14px; font-size:12.5px; color:var(--textSecondary); line-height:1.7; margin-bottom:14px}
.note-box b{color:var(--textPrimary)}
.section-title{font-weight:700; font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:8px}
.sub-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
/* ---------- 弹窗 ---------- */
.modal-mask{position:fixed; inset:0; background:var(--overlay); display:none; place-items:center; z-index:50}
.modal-mask.show{display:grid}
.modal{background:var(--surface1); border:1px solid var(--border); border-radius:14px; width:min(720px,92vw); max-height:84vh; overflow:auto; box-shadow:0 20px 60px var(--shadowColor)}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface1); z-index:1}
.modal-head .mt{font-weight:700}
.modal-body{padding:16px 18px}
.chunk-meta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--textMuted); margin-bottom:10px}
.chunk-meta .score{color:var(--success); font-weight:700}
.foot-note{padding:10px 18px; color:var(--textFaint); font-size:11.5px; border-top:1px solid var(--border); background:var(--surface1)}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:var(--scrollbar); border-radius:6px; border:2px solid var(--canvas)}


/* === 角色中心新组件 === */
.side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.side-title{font-size:13px;color:var(--ink-mid);font-weight:600;letter-spacing:.04em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:880px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--ink-mid);font-weight:600}
.field input,.field textarea,.field select,.search-input{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
.field textarea{min-height:54px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink)}
.chip button{background:none;border:none;color:var(--ink-mid);cursor:pointer;font-size:13px;line-height:1;padding:0}
.chip.dashed{border-style:dashed;cursor:pointer;color:var(--accent)}
.chip-input{background:var(--surface-2);border:1px dashed var(--border);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink);outline:none;width:140px}
.chip-input:focus{border-color:var(--accent)}
.skin-binder{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px}
.skin-card{width:200px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.skin-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin-card-avatar{width:100%;height:96px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-weight:700}
.skin-card-name{font-weight:600;font-size:14px}
.skin-card-desc{font-size:12px;color:var(--ink-mid)}
.skin-foot{margin-top:4px}
.nested-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab.sm{padding:6px 14px;font-size:13px;border-radius:8px 8px 0 0}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tool-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.tool-name{font-family:var(--mono);font-size:13px}
.chip-list{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--ink-mid);font-size:13px}
.detail-wrap{padding:22px 26px;max-width:1180px}
.detail-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.detail-avatar{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;flex-shrink:0}
.detail-headinfo{display:flex;flex-direction:column;gap:3px}
.detail-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.detail-sub{font-size:12px;color:var(--ink-mid)}
.tag{font-size:11px;font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;color:var(--ink-mid);font-weight:500}
.tabs{display:flex;gap:4px;padding:16px 0 0}
.tab{padding:9px 18px;font-size:14px;color:var(--ink-mid);cursor:pointer;border-radius:9px 9px 0 0;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-body{padding:18px 0 30px}
.skin-editor{display:grid;grid-template-columns:320px 1fr;gap:20px;margin-top:14px}
.skin-left{display:flex;flex-direction:column;gap:14px}
.skin-right{display:flex;flex-direction:column;gap:14px}
.visual-slot{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.visual-slot.portrait .vs-preview{width:232px;aspect-ratio:3/4;height:auto;margin:0 auto}
.visual-slot.original .vs-preview{width:64px;height:64px}
.visual-slot.avatar{display:flex;flex-direction:row;align-items:center;gap:14px}
.visual-slot.avatar .vs-preview{width:64px;height:64px;flex:0 0 64px}
.vs-preview{width:100%;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,rgba(120,120,200,.15),rgba(120,120,200,.04));display:flex;align-items:center;justify-content:center}
.vs-preview img,.vs-preview video{width:100%;height:100%;object-fit:cover}
.vs-preview.lg{width:64px;height:64px}
.vs-name{font-size:12px;color:var(--ink-mid);font-weight:600}
.visual-slot-empty{color:var(--ink-mid);font-size:12px;opacity:.7}
.animations{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:4px}
.visual-slot.motion .vs-preview{width:130px;height:130px;margin:0 auto}
.kpi-row{display:flex;gap:14px;flex-wrap:wrap}
.kpi{flex:1;min-width:140px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:16px}
.kv{font-size:26px;font-weight:700}
.kl{font-size:12px;color:var(--ink-mid);margin-top:2px}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:99}
.toast.show{opacity:.94;transform:translateX(-50%) translateY(0)}

/* === 主题变量别名（修复新组件区引用的旧命名，随主题自动切换） === */
:root{
  --ink:var(--textPrimary); --ink-mid:var(--textSecondary); --ink-faint:var(--textMuted);
  --surface:var(--surface1); --surface-2:var(--surface2);

}

.basic-grid{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1024px){.basic-grid{grid-template-columns:1fr}}
.basic-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.form-card{background:var(--surface1);border:1px solid var(--border);border-radius:14px;overflow:hidden}

.fc-head svg{color:var(--accent)}
.fc-head .fc-sub{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--ink-faint)}
.fc-body{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fc-body.single{grid-template-columns:1fr}
.fc-body .field{min-width:0}
.field.full{grid-column:1/-1}
.field label{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.label-hint{font-weight:400;font-size:11px;color:var(--ink-faint)}
.field textarea{line-height:1.6}
.field input[readonly]{font-family:var(--mono);font-size:12.5px;color:var(--ink-mid);background:transparent;border-style:dashed;cursor:default}
.color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=color].swatch{-webkit-appearance:none;appearance:none;width:46px;height:34px;padding:0;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);cursor:pointer;transition:.15s}
input[type=color].swatch:hover{border-color:var(--accent)}
input[type=color].swatch::-webkit-color-swatch-wrapper{padding:3px}
input[type=color].swatch::-webkit-color-swatch{border:none;border-radius:6px}
input[type=color].swatch::-moz-color-swatch{border:none;border-radius:6px}
.color-hex{font-family:var(--mono);font-size:12.5px;color:var(--ink-mid);background:var(--input);border:1px solid var(--border);border-radius:7px;padding:4px 9px}
.color-preview{display:inline-flex;align-items:center;gap:8px;margin-left:2px}
.cp-avatar{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.cp-tag{font-size:11px;font-family:var(--mono);border-radius:6px;padding:2px 8px;border:1px solid var(--border)}
.chip{transition:.15s}
.chip:hover{border-color:var(--accent)}
.chip button:hover{color:var(--danger)}
.setting-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px dashed var(--borderSubtle)}
.setting-row:last-child{border-bottom:none}
.setting-row .sr-main{flex:1;min-width:0}
.setting-row .sr-name{font-weight:600;font-size:13px}
.setting-row .sr-desc{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.setting-row input[type=number]{width:110px}
.form-foot{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 18px;border:1px solid var(--border);border-radius:12px;background:color-mix(in srgb,var(--canvas) 76%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.form-foot .hint{font-size:12px;color:var(--ink-faint)}
.form-foot .spacer{flex:1}

  } else {
    sb.innerHTML = `<div class="side-head"><span class="side-title">角色</span><button class="icon-btn" data-act="char:create" title="新建角色"><span id="ic-add2b"></span></button></div>
      <div class="kb-list">${CHARACTERS.map(c=>`
        <div class="kb-card ${c.id===state.charId?'active':''}" data-act="char:select:${c.id}">
          <div class="kb-avatar" style="background:${c.color}">${esc(charInitial(c))}</div>
          <div class="kb-name">${esc(c.name)}</div>
          <div class="kb-desc">${esc(roleLabel(c.role))} · ${c.enabled?'启用':'停用'}</div>
          <div class="kb-meta">${c.skinId?`<span class="stat-pill">皮肤 ${esc(c.skinId)}</span>`:`<span class="stat-pill" style="opacity:.6">默认皮肤</span>`}</div>
        </div>`).join('')}</div>`;
  }
  const a=document.getElementById('ic-add2')||document.getElementById('ic-add2b'); if(a) a.innerHTML=ic('add',15);
}
function renderBody(){
  const d=$('detail');
  if(state.section==='skin') d.innerHTML = renderSkinDetail();
  else d.innerHTML = renderCharacterDetail();
}

/* ===================== 渲染：角色详情 ===================== */
function renderCharacterDetail(){
  const c=getChar();
  const tabs=[['basic','基础'],['visual','视觉与动画'],['memory','记忆'],['tools','工具'],['skills','技能'],['stats','统计']];
  return `<div class="detail-wrap">
    <div class="detail-head">
      <div class="detail-avatar" style="background:${c.color}">${esc(charInitial(c))}</div>
      <div class="detail-headinfo">
        <div class="detail-name">${esc(c.name)} <span class="tag">${esc(c.id)}</span></div>
        <div class="detail-sub">${esc(roleLabel(c.role))} · ${c.enabled?'<span style="color:var(--success)">已启用</span>':'<span style="color:var(--danger)">已停用</span>'} · 分组 ${esc((c.groups||[]).join(' / ')||'—')}</div>
      </div>
      <div style="flex:1"></div>
      <label class="switch"><input type="checkbox" data-act="char:enabled" ${c.enabled?'checked':''}><span class="slider"></span></label>
      <button class="btn" data-act="char:edit-skin">${ic('link',14)} 绑定皮肤</button>
    </div>
    <div class="tabs" id="charTabs">${tabs.map(([k,l])=>`<div class="tab ${k===state.charTab?'active':''}" data-act="char:tab:${k}">${l}</div>`).join('')}</div>
    <div class="tab-body">${renderCharTab(c)}</div>
  </div>`;
}
function renderCharTab(c){
  if(state.charTab==='basic') return renderCharBasic(c);
  if(state.charTab==='visual') return renderCharVisual(c);
  if(state.charTab==='memory') return renderCharMemory(c);
  if(state.charTab==='tools') return renderCharTools(c);
  if(state.charTab==='skills') return renderCharSkills(c);
  if(state.charTab==='stats') return renderCharStats(c);
  return '';
}
function renderCharBasic(c){
  return `<div class="basic-wrap">
    <div class="basic-grid">
      <section class="form-card">
        <div class="fc-head">${ic('robot',14)} 基本信息<span class="fc-sub">身份、归属与协作策略</span></div>
        <div class="fc-body">
          <div class="field"><label>名称</label><input type="text" data-charfield="name" value="${esc(c.name)}"></div>
          <div class="field"><label>角色 ID<span class="label-hint">创建后不可修改</span></label><input type="text" value="${esc(c.id)}" readonly></div>
          <div class="field full"><label>描述<span class="label-hint">展示在角色列表与选择器中</span></label><textarea data-charfield="description">${esc(c.description||'')}</textarea></div>
          <div class="field"><label>角色类型</label><select data-charfield="role"><option value="main" ${c.role==='main'?'selected':''}>主 Agent</option><option value="sub" ${c.role==='sub'?'selected':''}>子 Agent</option><option value="both" ${c.role==='both'?'selected':''}>主 / 子 Agent</option></select></div>
          <div class="field"><label>默认策略<span class="label-hint">被委派任务时的审批模式</span></label><select data-charfield="default_strategy"><option ${c.default_strategy==='Off'?'selected':''}>Off</option><option ${c.default_strategy==='Read Only'?'selected':''}>Read Only</option><option ${c.default_strategy==='Review'?'selected':''}>Review</option><option ${c.default_strategy==='Auto Approve'?'selected':''}>Auto Approve</option></select></div>
          <div class="field full"><label>主题色<span class="label-hint">用于头像、标识与强调色</span></label>
            <div class="color-row">
              <input type="color" class="swatch" data-charfield="color" value="${esc(c.color)}">
              <span class="color-hex">${esc(c.color)}</span>
              <span class="color-preview"><span class="cp-avatar" style="background:${esc(c.color)}">${esc(charInitial(c))}</span><span class="cp-tag" style="color:${esc(c.color)};border-color:${esc(c.color)}66;background:${esc(c.color)}14">${esc(c.id)}</span></span>
            </div>
          </div>
          <div class="field full"><label>分组<span class="label-hint">角色归类标签，不影响记忆访问（记忆严格角色自有）</span></label>
            <div class="chips">${(c.groups||[]).map(g=>`<span class="chip">${esc(g)} <button data-act="char:group:remove:${g}">×</button></span>`).join('')}<input class="chip-input" placeholder="输入后回车" data-act="char:group:add"></div>
          </div>
        </div>
      </section>
      <div class="basic-side">
        <section class="form-card">
          <div class="fc-head">${ic('bolt',14)} 人格与提示词<span class="fc-sub">注入系统提示词</span></div>
          <div class="fc-body single">
            <div class="field"><label>Soul（角色灵魂）<span class="label-hint">人格与口吻，置于系统提示词最前</span></label><textarea data-charfield="soul" style="min-height:120px">${esc(c.soul||'')}</textarea></div>
            <div class="field"><label>用户画像 userProfile<span class="label-hint">描述服务对象，影响回复视角</span></label><textarea data-charfield="userProfile" style="min-height:96px">${esc(c.userProfile||'')}</textarea></div>
          </div>
        </section>
      </div>
    </div>
    <div class="form-foot">
      <span class="hint">演示：修改即时写入内存态，刷新页面后还原</span>
      <span class="spacer"></span>
      <button class="btn primary" data-act="char:save">${ic('check',13)} 保存修改</button>
    </div>
  </div>`;
}
function renderCharVisual(c){
  const activeId=c.skinId||'';
  return `<div class="detail-section">
    <div class="section-title">${ic('link',14)} 绑定皮肤</div>
    <div class="visual-slot-file">${activeId?`已激活：<b>${esc(getSkinName(activeId))}</b>`:`未激活皮肤 · 默认展示同名皮肤 <b>${esc(c.id)}</b>`}</div>
    <div class="skin-binder">${SKINS.map(s=>{
      const isActive=activeId===s.id; const isDefault=!activeId&&s.id===c.id;
      return `<div class="skin-card ${isActive?'active':''}">
        <div class="skin-card-avatar" style="background:${s.color}">${esc(charInitial(s))}</div>
        <div class="skin-card-name">${esc(s.name)}</div>
        <div class="skin-card-desc">${esc(s.id)}</div>
        <div class="skin-foot">${isActive?`<button class="btn sm" data-act="skin:deactivate" style="color:var(--danger)">取消激活</button>`:`<button class="btn sm primary" data-act="skin:activate:${s.id}">激活</button>`}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}
function renderCharMemory(c){
  const mem=MEMORIES[c.id];
  if(!mem){ return `<div class="empty" style="padding:30px">该角色暂无记忆演示数据（演示记忆仅「小枢」）。切到「小枢」查看完整记忆浏览器 / 绑定与权限 / 审计。</div>`; }
  const tabs=[['overview','概览'],['browser','记忆浏览器'],['binding','绑定与权限'],['audit','审计']];
  let body;
  if(state.memTab==='overview') body=renderMemOverview();
  else if(state.memTab==='browser') body=renderMemBrowser();
  else if(state.memTab==='binding') body=renderMemBinding();
  else if(state.memTab==='audit') body=renderMemAudit();
  return `<div class="nested-tabs">${tabs.map(([k,l])=>`<div class="tab sm ${k===state.memTab?'active':''}" data-act="mem:tab:${k}">${l}</div>`).join('')}</div>${body}`;
}
function renderCharTools(c){
  const bound=new Set((c.tools||[]).map(t=>t.name));
  return `<div class="detail-section"><div class="section-title">${ic('tool',14)} 已绑定工具（${bound.size}）</div>
    <div class="tool-grid">${TOOLS_META.map(name=>{
      const on=bound.has(name);
      return `<div class="tool-row"><span class="tool-name">${esc(name)}</span>
        <label class="switch"><input type="checkbox" data-act="tool:toggle:${name}" ${on?'checked':''}><span class="slider"></span></label></div>`;
    }).join('')}</div></div>`;
}
function renderCharSkills(c){
  const bound=(c.skillBindings||c.skills||[]).map(x=>typeof x==='string'?x:x.packageId);
  const unbound=ALL_SKILLS.filter(s=>!bound.includes(s));
  return `<div class="detail-section"><div class="section-title">已绑定技能包（${bound.length}）</div>
    <div class="chip-list">${bound.map(s=>`<span class="chip">${esc(s)} <button data-act="skill:remove:${s}">×</button></span>`).join('')||'<span class="muted">暂无</span>'}</div>
    <div class="section-title" style="margin-top:14px">可绑定</div>
    <div class="chip-list">${unbound.map(s=>`<span class="chip dashed" data-act="skill:add:${s}">+ ${esc(s)}</span>`).join('')||'<span class="muted">已全部绑定</span>'}</div>
  </div>`;
}
function renderCharStats(c){
  const st=c.stats||{};
  return `<div class="detail-section"><div class="section-title">使用概览</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kv">${st.sessionCount??'--'}</div><div class="kl">会话数</div></div>
      <div class="kpi"><div class="kv">--</div><div class="kl">成功率</div></div>
      <div class="kpi"><div class="kv">${timeAgo(st.lastActive)}</div><div class="kl">最近活跃</div></div>
    </div>
    <div class="detail-section" style="margin-top:14px"><div class="section-title">调用趋势</div><div class="empty">需要后端打点后展示</div></div>
  </div>`;
}

/* ===================== 渲染：皮肤详情 ===================== */
function uploadBtn(slot){ return `<label class="btn sm" style="margin-top:6px">上传<input type="file" accept="image/*,video/*" hidden data-upload="${slot}"></label>`; }
function renderSkinDetail(){
  const s=getSkin();
  const pv=state.skinPreview[s.id]||{};
  const slot=(url,label,kind)=> url
    ? (kind==='video'?`<video src="${url}" autoplay muted loop playsinline></video>`:`<img src="${url}">`)
    : `<span class="visual-slot-empty">${esc(label)}</span>`;
  return `<div class="detail-wrap">
    <div class="detail-head">
      <div class="detail-avatar" style="background:${s.color}">${esc(charInitial(s))}</div>
      <div class="detail-headinfo">
        <div class="detail-name">${esc(s.name)} <span class="tag">${esc(s.id)}</span></div>
        <div class="detail-sub">${s.boundCharacters&&s.boundCharacters.length?`${s.boundCharacters.length} 个角色使用`:'未绑定角色'}</div>
      </div>
      <div style="flex:1"></div>
      <button class="btn" data-act="skin:delete" style="color:var(--danger)">删除皮肤</button>
    </div>
    <div class="skin-editor">
      <div class="skin-left">
        <div class="visual-slot portrait">
          <div class="vs-preview">${slot(pv.portrait,'立绘')}</div>
          <div class="vs-name">立绘 (portrait)</div>
          ${uploadBtn('portrait')}
        </div>
        <div class="visual-slot original">
          <div class="vs-preview">${slot(pv.original,'原画')}</div>
          <div class="vs-name">原画 (original)</div>
          ${uploadBtn('original')}
        </div>
      </div>
      <div class="skin-right">
        <div class="visual-slot avatar">
          <div class="vs-preview lg">${slot(pv.avatar,'头像')}</div>
          <div class="vs-name">头像 (avatar)</div>
          ${uploadBtn('avatar')}
        </div>
        <div class="animations">
          ${SKIN_MOTIONS.map(m=>`
            <div class="visual-slot motion">
              <div class="vs-preview">${slot(pv[m], MOTION_LABELS[m]||m, 'video')}</div>
              <div class="vs-name">${MOTION_LABELS[m]||m}</div>
              ${uploadBtn(m)}
            </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="hint" style="margin-top:12px">演示：点击「上传」选择本地图片/视频，仅前端预览，不落盘。</div>
  </div>`;
}

/* ===================== 事件 ===================== */
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const [act,...rest]=t.dataset.act.split(':');
  const a1=rest[0], a2=rest[1], aRest=rest.slice(1).join(':');
  if(act==='section'){ state.section=a1; render(); }
  else if(act==='char'){
    if(a1==='select'){ state.charId=a2; state.memChar=a2; state.charTab='basic'; render(); }
    else if(a1==='tab'){ state.charTab=a2; renderBody(); }
    else if(a1==='enabled'){ const c=getChar(); c.enabled=!c.enabled; renderBody(); }
    else if(a1==='edit-skin'){ state.charTab='visual'; renderBody(); }
    else if(a1==='save'){ toast('已保存（演示）'); }
    else if(a1==='create'){ toast('演示：弹出新建角色对话框'); }
    else if(a1==='group'){
      if(a2==='add'){ const inp=t.previousElementSibling; const v=(inp.value||'').trim(); if(v){ const c=getChar(); c.groups=c.groups||[]; if(!c.groups.includes(v)) c.groups.push(v); renderBody(); } }
      else if(a2==='remove'){ const c=getChar(); const g=aRest; c.groups=(c.groups||[]).filter(x=>x!==g); renderBody(); }
    }
  }
  else if(act==='skin'){
    if(a1==='select'){ state.skinId=a2; render(); }
    else if(a1==='activate'){ const c=getChar(); c.skinId=a2; renderBody(); }
    else if(a1==='deactivate'){ const c=getChar(); c.skinId=null; renderBody(); }
    else if(a1==='delete'){ toast('演示：删除皮肤'); }
    else if(a1==='create'){ toast('演示：弹出新建皮肤对话框'); }
  }
  else if(act==='tool'){ if(a1==='toggle'){ const name=a2; const c=getChar(); const set=new Set((c.tools||[]).map(x=>x.name)); if(set.has(name)) c.tools=c.tools.filter(x=>x.name!==name); else c.tools.push({name}); renderBody(); } }
  else if(act==='skill'){ const name=a2; const c=getChar(); const arr=c.skillBindings||c.skills||[]; if(a1==='add'){ if(!arr.includes(name)) arr.push(name); } else { const i=arr.indexOf(name); if(i>=0) arr.splice(i,1); } if(c.skillBindings) c.skillBindings=arr; else c.skills=arr; renderBody(); }
  else if(act==='mem'){
    if(a1==='char'){ state.memChar=a2; state.charId=a2; state.memFilter='all'; render(); }
    else if(a1==='tab'){ state.memTab=a2; renderBody(); }
    else if(a1==='filter'){ state.memFilter=a2; renderBody(); }
    else if(a1==='act'){
      const [sub,mid]=rest.slice(1); const m=MEMORIES[state.memChar]; if(!m) return; const x=m.l1.find(z=>z.id===mid); if(!x) return;
      if(sub==='approve'){ x.status='active'; x.note='已由用户批准，进入稳定 Snapshot。'; }
      else if(sub==='resolve'){ x.status='active'; x.conflictWith=null; x.note='用户已解决冲突，采纳新结论。'; }
      else if(sub==='forget'){ m.l1=m.l1.filter(z=>z.id!==mid); }
      else if(sub==='edit'){ openMemEdit(mid); return; }
      renderBody();
    }
    else if(a1==='save'){ const id=$('memModal').dataset.id; const x=MEMORIES[state.memChar].l1.find(z=>z.id===id); if(x){ x.subject=$('memEditSubject').value; x.content=$('memEditContent').value; } $('memModal').classList.remove('show'); renderBody(); }
  }
  else if(act==='memmodal'){ $('memModal').classList.remove('show'); }
  else if(act==='theme'){ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; }
});

function openMemEdit(id){
  const m=MEMORIES[state.memChar]; if(!m) return;
  const x=m.l1.find(z=>z.id===id); if(!x) return;
  $('memEditSubject').value=x.subject||'';
  $('memEditContent').value=x.content||'';
  $('memModal').dataset.id=id;
  $('memModal').classList.add('show');
}
document.addEventListener('change', e=>{
  const up=e.target.closest('[data-upload]');
  if(up){ const slot=up.dataset.upload; const f=up.files&&up.files[0]; if(f){ const url=URL.createObjectURL(f); state.skinPreview[state.skinId]=state.skinPreview[state.skinId]||{}; state.skinPreview[state.skinId][slot]=url; renderBody(); } return; }
  const cf=e.target.closest('[data-charfield]');
  if(cf){ const k=cf.dataset.charfield; const c=getChar();
    if(k==='name') c.name=cf.value;
    else if(k==='description') c.description=cf.value;
    else if(k==='color'){ c.color=cf.value; renderBody(); }
    else if(k==='role'){ c.role=cf.value; renderBody(); }
    else if(k==='default_strategy'){ c.default_strategy=cf.value; }
    else if(k==='soul') c.soul=cf.value;
    else if(k==='userProfile') c.userProfile=cf.value;
    else if(k==='memoryContent') c.memoryContent=cf.value;
    else if(k==='memEnabled'){ c.memory=c.memory||{}; c.memory.enabled=cf.checked; }
    else if(k==='charLimit'){ c.memory=c.memory||{}; c.memory.charLimit=+cf.value; }
    return;
  }
  const lo=e.target.closest('[data-loadout]'); if(lo){ const row=(LOADOUT[state.memChar]||[]).find(t=>t.tool===lo.dataset.loadout); if(row) row.on=lo.checked; }
});
$('memModal').addEventListener('click', e=>{ if(e.target.id==='memModal') $('memModal').classList.remove('show'); });

function render(){
  document.querySelectorAll('#sectionSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.act===`section:${state.section}`));
  renderCrumb(); renderSidebar(); renderBody();
}
render();

</script>
</html>
